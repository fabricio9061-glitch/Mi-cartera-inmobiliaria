<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Administración · MALAVE</title>
  <link rel="icon" type="image/png" href="iso-malave.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{
      --navy:#16273f; --navy-2:#243447; --ink:#16273f;
      --gold:#c9a961; --gold-2:#C9A227;
      --paper:#f5f6f8; --card:#fff; --line:#e7eaef; --line-2:#f0f2f5;
      --muted:#8a8f96; --muted-2:#a8adb4;
      --ok:#15a05a; --warn:#d97706; --bad:#c0392b;
      --r:12px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
    /* clip y no hidden: hidden convierte al body en contenedor de scroll y rompe
       todos los position:sticky de la página. */
    html,body{overflow-x:clip}
    a{color:inherit;text-decoration:none}

    /* ===== Cabecera ===== */
    .ad-top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:80;
      padding-top:env(safe-area-inset-top,0px)}
    .ad-top-in{max-width:1240px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
    .ad-marca{display:inline-flex;align-items:center;gap:11px}
    .ad-marca img:first-child{height:34px;width:auto}
    .ad-marca img:last-child{height:15px;width:auto}
    @media(max-width:480px){ .ad-marca img:last-child{display:none} }
    .ad-back{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
      border-radius:99px;padding:8px 16px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;background:var(--card)}
    .ad-back:hover{color:var(--ink);border-color:var(--muted-2)}

    /* ===== Navegación ===== */
    .ad-nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:63px;z-index:70}
    .ad-nav-in{max-width:1240px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
    .ad-nav-in::-webkit-scrollbar{display:none}
    .ad-t{border:none;background:none;font-family:inherit;font-size:.89rem;font-weight:500;color:var(--muted);
      padding:14px 16px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .13s,border-color .13s;
      display:inline-flex;align-items:center;gap:8px}
    .ad-t:hover{color:var(--ink)}
    .ad-t.on{color:var(--ink);border-bottom-color:var(--gold-2);font-weight:600}
    .ad-t b{font-size:.68rem;font-weight:700;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;min-width:18px;text-align:center}

    .ad-wrap{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
    .ad-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
    .ad-head > div:first-child{flex:1;min-width:200px}
    .ad-h{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;margin:0 0 4px}
    .ad-sub{font-size:.88rem;color:var(--muted);margin:0}
    .ad-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .ad-busca{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
      border-radius:10px;padding:9px 13px;min-width:230px}
    .ad-busca i{color:var(--muted-2);font-size:.82rem}
    .ad-busca input{border:none;outline:none;font-family:inherit;font-size:.87rem;background:none;width:100%;color:var(--ink)}
    .ad-sel{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;
      font-family:inherit;font-size:.86rem;color:var(--ink);cursor:pointer}
    @media(max-width:600px){ .ad-tools{width:100%} .ad-busca{flex:1;min-width:0} }

    /* ===== Bloques ===== */
    /* Resumen del equipo */
    .resumen{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);
      border-radius:var(--r);overflow:hidden;margin-bottom:4px}
    .rs{flex:1;background:var(--card);padding:15px 17px;min-width:0}
    .rs b{display:block;font-size:1.35rem;font-weight:600;color:var(--ink);line-height:1.15}
    .rs b.ok{color:var(--ok)} .rs b.warn{color:var(--warn)}
    .rs span{display:block;font-size:.66rem;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
    @media(max-width:700px){
      .resumen{flex-wrap:wrap}
      .rs{flex:1 0 calc(50% - 1px);padding:13px 14px}
      .rs b{font-size:1.15rem}
    }
    .ad-sec{display:flex;align-items:center;gap:10px;margin:26px 0 11px}
    .ad-sec:first-child{margin-top:0}
    .ad-sec span{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .ad-sec b{font-size:.7rem;font-weight:600;color:var(--muted-2)}
    .ad-sec i{flex:1;height:1px;background:var(--line)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

    /* ===== Filas ===== */
    .row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
    .row:last-child{border-bottom:none}
    .row:hover{background:#fbfcfd}
    .av{width:40px;height:40px;border-radius:50%;flex:none;background:var(--navy);color:#fff;display:flex;
      align-items:center;justify-content:center;font-size:.9rem;font-weight:600;overflow:hidden}
    .av img{width:100%;height:100%;object-fit:cover}
    .id{flex:1;min-width:0}
    .id-n{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .id-n b{font-size:.92rem;font-weight:600;color:var(--ink)}
    .id-n .chip{font-size:.66rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--paper);color:var(--muted)}
    .id-n .chip.oro{background:rgba(201,162,39,.13);color:#8a6d12}
    .id-n .chip.warn{background:#fffbeb;color:var(--warn)}
    .id-s{font-size:.78rem;color:var(--muted-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Métricas: lo que llena el hueco vacío que antes no decía nada. */
    .mets{display:flex;gap:26px;flex:none;text-align:right}
    .met b{display:block;font-size:.95rem;font-weight:600;color:var(--ink);line-height:1.2}
    .met b.ok{color:var(--ok)}
    .met b.nada{color:var(--muted-2)}
    .met span{display:block;font-size:.63rem;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

    .cpk{flex-direction:row;align-items:center;gap:9px}
    .cpk input{width:17px;height:17px;flex:none}
    .cpk span{font-size:.9rem}
    .kb{flex:none;width:32px;height:32px;border:none;background:none;border-radius:8px;color:var(--muted-2);
      cursor:pointer;font-size:.95rem;transition:background .13s,color .13s}
    .kb:hover{background:var(--paper);color:var(--ink)}

    /* ===== Menú ===== */
    /* Panel lateral de edición */
    .slide{position:fixed;inset:0;background:rgba(16,29,48,.42);z-index:500;display:flex;justify-content:flex-end}
    .slide-box{background:var(--card);width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;
      box-shadow:-14px 0 40px rgba(10,20,35,.18);animation:entra .22s ease}
    @keyframes entra{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
    .slide-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
    .slide-h b{flex:1;font-size:1rem;font-weight:600}
    .slide-b{flex:1;overflow-y:auto;padding:20px}
    .slide-f{display:flex;gap:9px;padding:16px 20px;border-top:1px solid var(--line)}
    .slide-f .bd-btn{flex:1;justify-content:center}
    .bd-btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
    .cp{display:block;margin-bottom:15px}
    .cp span{display:block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
    .cp input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.92rem;color:var(--ink)}
    /* ===== Revisiones ===== */
    .rev-alerta{display:flex;align-items:center;gap:9px;padding:12px 14px;margin-bottom:16px;
      background:#fffbeb;border:1px solid #fde68a;border-radius:12px;color:#92400e;font-size:.88rem}
    .rev-alerta i{color:#d97706}
    .rev-lista{display:flex;flex-direction:column;gap:10px}
    .rev-item{display:flex;align-items:flex-start;gap:13px;padding:14px;background:var(--card);
      border:1px solid var(--line);border-radius:12px}
    /* Las pendientes llevan una barra dorada a la izquierda: son las que piden acción. */
    .rev-item.pend{border-left:3px solid var(--gold)}
    .rev-ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:.95rem}
    .rev-cuerpo{flex:1;min-width:0}
    .rev-tit{font-weight:600;font-size:.93rem;color:var(--ink);display:flex;align-items:center;
      gap:8px;flex-wrap:wrap;margin-bottom:3px}
    .rev-sub{font-size:.79rem;color:var(--muted)}
    .rev-motivo{margin-top:5px;font-size:.78rem;color:#b91c1c}
    .rev-chip{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;
      display:inline-flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.04em}
    .rev-chip.pend{background:#fef3c7;color:#b45309}
    .rev-chip.si{background:#dcfce7;color:#15803d}
    .rev-chip.no{background:#fee2e2;color:#b91c1c}
    .rev-acc{display:flex;gap:7px;flex-wrap:wrap;flex:none}
    .rev-b{font-family:inherit;font-size:.8rem;font-weight:600;padding:8px 13px;border-radius:9px;
      border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
      text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:border-color .13s}
    .rev-b:hover{border-color:#c2c6cb}
    .rev-b.ok{background:var(--ink);color:#fff;border-color:var(--ink)}
    .rev-b.no{color:#b91c1c}
    @media (max-width:640px){
      .rev-item{flex-wrap:wrap}
      .rev-acc{flex:1 0 100%;margin-top:4px}
      .rev-b{flex:1;justify-content:center}
    }

    .cp select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
      font-family:inherit;font-size:.92rem;color:var(--ink);background:var(--card);cursor:pointer}
    .cp select:focus{outline:none;border-color:var(--ink)}
    .cp input:focus{outline:none;border-color:var(--ink)}
    .cp input:disabled{background:var(--paper);color:var(--muted-2)}
    .cp-nota{font-size:.79rem;color:var(--muted);line-height:1.5;margin:0 0 16px}
    @media(max-width:600px){
      /* Hoja desde abajo, como el resto de la app. */
      .slide{align-items:flex-end}
      .slide-box{max-width:none;height:auto;max-height:90vh;border-radius:18px 18px 0 0}
      .slide-f{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
      .cp input,.cp select{font-size:16px}
    }
    .menu{position:fixed;z-index:400;background:var(--card);border:1px solid var(--line);border-radius:12px;
      box-shadow:0 14px 40px rgba(10,20,35,.16);padding:6px;min-width:196px}
    .menu button{width:100%;display:flex;align-items:center;gap:11px;border:none;background:none;text-align:left;
      font-family:inherit;font-size:.86rem;color:#3d4349;padding:10px 12px;border-radius:8px;cursor:pointer}
    .menu button:hover{background:var(--paper);color:var(--ink)}
    .menu button i{width:15px;text-align:center;color:var(--muted-2)}
    .menu button.mal,.menu button.mal i{color:var(--bad)}

    /* ===== Bandeja ===== */
    .bd-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
    .bd-row:last-child{border-bottom:none}
    .bd-dot{width:7px;height:7px;border-radius:50%;flex:none}
    .bd-row.alta .bd-dot{background:var(--bad)}
    .bd-row.media .bd-dot{background:var(--warn)}
    .bd-row.baja .bd-dot{background:var(--muted-2)}
    .bd-ico{flex:none;width:32px;height:32px;border-radius:9px;background:var(--paper);color:var(--muted);
      display:flex;align-items:center;justify-content:center;font-size:.82rem}
    .bd-row.alta .bd-ico{background:#fef2f2;color:var(--bad)}
    .bd-txt{flex:1;min-width:0}
    .bd-txt b{display:block;font-size:.89rem;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bd-txt span{display:block;font-size:.77rem;color:var(--muted-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bd-btn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 15px;
      font-family:inherit;font-size:.82rem;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .13s}
    .bd-btn:hover{border-color:var(--ink)}

    /* ===== Estados ===== */
    .vacio{text-align:center;padding:56px 20px;color:var(--muted)}
    .vacio i{font-size:2.4rem;color:var(--line);margin-bottom:14px;display:block}
    .vacio h3{font-size:1rem;font-weight:600;color:var(--ink);margin:0 0 5px}
    .vacio p{font-size:.86rem;margin:0}
    .cargando{display:flex;justify-content:center;padding:56px}
    .sp{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--gold-2);border-radius:50%;animation:gir .7s linear infinite}
    @keyframes gir{to{transform:rotate(360deg)}}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
      padding:13px 22px;border-radius:12px;font-size:.87rem;z-index:600;opacity:0;transition:opacity .2s;pointer-events:none}
    .toast.on{opacity:1}

    /* ===== Celular ===== */
    @media(max-width:820px){
      .mets{gap:16px}
      .met:nth-child(2),.met:nth-child(4){display:none}
    }
    @media(max-width:600px){
      .ad-top-in,.ad-nav-in,.ad-wrap{padding-left:15px;padding-right:15px}
      .ad-h{font-size:1.5rem}
      .ad-t{padding:12px 12px;font-size:.84rem}
      .row{flex-wrap:wrap;padding:13px 14px}
      /* Las métricas pasan abajo, a lo ancho: en línea quedaban ilegibles. */
      .mets{flex:1 0 100%;justify-content:space-between;text-align:left;gap:10px;
        padding-top:11px;margin-top:3px;border-top:1px solid var(--line-2)}
      /* El botón de acciones va en el DOM después de las métricas, así que al
         envolver la fila caía suelto debajo de "Propiedades". Se reordena para
         que quede arriba, a la derecha del nombre, que es donde se lo busca. */
      .row .kb{order:2;align-self:flex-start}
      .mets{order:3}
      .met span{font-size:.6rem}
      .bd-row{flex-wrap:wrap}
      .bd-txt{flex:1 1 calc(100% - 60px)}
      .bd-txt b,.bd-txt span{white-space:normal}
      .bd-btn{flex:1 1 100%;padding:10px}
      .menu{left:0!important;right:0;top:auto!important;bottom:0;border-radius:16px 16px 0 0;
        padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));min-width:0}
      .menu button{padding:14px 13px;font-size:.94rem}
    }
  
    /* ============================================================================
       CABECERA UNIFICADA — estándar tomado de finanzas.html
       Cada herramienta tenía la suya (.header, .top, .gh-header, .ad-top) y el
       "volver" era a veces un enlace suelto y a veces un botón. Acá se llevan
       todas al mismo aspecto sin tocar el markup de cada página: barra blanca
       pegada arriba y "Volver" como botón con contorno que se rellena al pasar.
       ========================================================================== */
    .header, .top, .gh-header, .ad-top{
      background:#fff !important; border-bottom:1px solid #eef1f5 !important;
      padding-top:env(safe-area-inset-top,0px);
    }
    .header-in, .top > .wrap, .gh-header, .ad-top-in{
      padding-top:14px; padding-bottom:14px;
    }
    /* El botón de volver, en todas sus variantes de clase */
    .back-link, .back, .gh-back, .ad-back, .tp-back, .fh-back{
      display:inline-flex !important; align-items:center; gap:7px;
      color:#6b7280 !important; font-size:.88rem; font-weight:500;
      padding:8px 15px !important; border:1px solid #eef1f5 !important;
      border-radius:999px !important; text-decoration:none !important;
      white-space:nowrap; background:#fff;
      transition:background .15s, color .15s, border-color .15s;
    }
    .back-link:hover, .back:hover, .gh-back:hover, .ad-back:hover, .tp-back:hover, .fh-back:hover{
      background:#16273f !important; color:#fff !important; border-color:#16273f !important;
    }
    /* El logo, al tamaño del estándar */
    .logo-img, .ad-marca img:first-child{ height:30px !important; width:auto; }
    .logo-text, .ad-marca img:last-child{ height:19px !important; width:auto; }
    @media (max-width:520px){
      .logo-img, .ad-marca img:first-child{ height:26px !important; }
      .logo-text, .ad-marca img:last-child{ height:16px !important; }
      .back-link, .back, .gh-back, .ad-back, .tp-back, .fh-back{ padding:8px 13px !important; }
      /* "Volver al inicio" no entra cómodo en pantallas chicas */
      .back-link span, .ad-back span{ display:none; }
    }

    /* ===== Sitio (testimonios y solicitudes) ===== */
    .st-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .st-tab{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;
      cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:600;color:var(--ink);
      display:inline-flex;align-items:center;gap:8px}
    .st-tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
    .st-tab b{background:#C9A227;color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
    .st-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px}
    .st-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
    .st-h b{font-size:.95rem}
    .st-rol{color:var(--muted,#6b7280);font-size:.82rem}
    .st-when{margin-left:auto;color:var(--muted,#9aa0a6);font-size:.78rem}
    .st-txt{font-style:italic;line-height:1.5;font-size:.9rem;background:rgba(0,0,0,.02);
      border-radius:9px;padding:11px 13px;white-space:pre-wrap;word-break:break-word}
    .st-rows{display:flex;flex-direction:column;gap:6px;font-size:.86rem}
    .st-row{display:flex;gap:10px}
    .st-row .lbl{min-width:78px;color:var(--muted,#6b7280)}
    .st-row span{word-break:break-word}
    .st-f{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
    .st-donde{color:var(--muted,#9aa0a6);font-size:.8rem}
    .st-acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
    .st-bar{background:#fffdf5;border:1px solid #eee6cf;border-left:4px solid #C9A227;border-radius:12px;
      padding:11px 15px;font-weight:700;margin-bottom:13px;color:#9a7d12;font-size:.88rem}
    .st-bar.ok{border-left-color:#2ecc71;color:#27ae60;background:var(--card);border-color:var(--line)}
    .st-chips{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:4px;width:fit-content;flex-wrap:wrap;margin-bottom:14px}
    .st-chip{border:none;background:transparent;cursor:pointer;border-radius:9px;padding:7px 14px;
      font-size:.85rem;font-weight:600;color:var(--muted,#666);font-family:inherit}
    .st-chip.on{background:var(--navy);color:#fff}
    @media(max-width:640px){.st-acts{margin-left:0;width:100%}.st-when{margin-left:0;width:100%}}

    /* ===== Equipo: cuenta sin acceso ===== */
    .id-n .chip.gris{background:#eef0f3;color:#6b7280}

    /* ===== Desempeño ===== */
    .dz-nota{font-size:.8rem;color:var(--muted);margin:10px 2px 16px;line-height:1.5}
    .rs b.dz-c-verde{color:#1f9d55} .rs b.dz-c-amarillo{color:#b7791f} .rs b.dz-c-rojo{color:#c62828}
    .dz-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
    .dz-row:last-child{border-bottom:none}
    .dz-row:hover{background:#fbfcfd}
    .dz-id{flex:0 0 190px;min-width:0}
    .dz-id b{display:block;font-size:.92rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="rangos.js?v=20260821b"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyDnCQLlJuBtZqXNwYILio9a8ltb972bXzQ",
    authDomain: "mi-cartera-inmobiliaria.firebaseapp.com",
    projectId: "mi-cartera-inmobiliaria",
    storageBucket: "mi-cartera-inmobiliaria.firebasestorage.app",
    messagingSenderId: "923595024127",
    appId: "1:923595024127:web:b7104adcba6387a5a84eca"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth(), db = firebase.firestore();
  var ADMIN_EMAIL = "fabricio9061@gmail.com";
  var yo = null, seccion = 'bandeja';

  // ---- Utilidades ----
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function escA(s){ return esc(s).replace(/'/g,'&#39;'); }
  function iniciales(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2600); }
  function plata(n, mon){ return (mon==='USD'?'US$ ':'$U ')+Math.round(n||0).toLocaleString('es-UY'); }
  function hace(iso){
    if(!iso) return '';
    var d=Math.floor((Date.now()-new Date(iso))/86400000);
    if(isNaN(d)) return '';
    if(d===0) return 'hoy'; if(d===1) return 'ayer';
    if(d<30) return 'hace '+d+' días';
    if(d<365) return 'hace '+Math.floor(d/30)+' mes'+(d<60?'':'es');
    return 'hace más de un año';
  }

  // ---- Menú contextual, reusable en todas las secciones ----
  function cerrarMenu(){ var m=document.querySelector('.menu'); if(m) m.remove(); }
  function abrirMenu(ev, opciones){
    ev.stopPropagation();
    // Se mide ANTES de cerrar el anterior: un elemento ya quitado del DOM
    // devuelve un rectángulo en cero y el menú aterriza en la esquina.
    var r = ev.currentTarget.getBoundingClientRect();
    cerrarMenu();
    var m=document.createElement('div');
    m.className='menu';
    m.innerHTML = opciones.map((o,i) =>
      '<button class="'+(o.mal?'mal':'')+'" data-i="'+i+'"><i class="fas '+o.ico+'"></i> '+esc(o.txt)+'</button>').join('');
    document.body.appendChild(m);
    m.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var o = opciones[+b.dataset.i];
        cerrarMenu();
        if (o && typeof o.fn === 'function') { try { o.fn(); } catch(e){ console.error(e); toast('No se pudo abrir'); } }
      });
    });
    var alto=m.offsetHeight;
    var y=(r.bottom+alto+8>window.innerHeight)?(r.top-alto-6):(r.bottom+6);
    m.style.top=Math.max(8,y)+'px';
    m.style.left=Math.max(8,Math.min(r.right-m.offsetWidth, window.innerWidth-m.offsetWidth-8))+'px';
    setTimeout(()=>document.addEventListener('click', cerrarMenu, {once:true}), 0);
  }

  // ---- Navegación ----
  var TITULOS = {
    bandeja:    ['Bandeja', 'Todo lo que espera una decisión tuya.'],
    equipo:     ['Equipo', 'Agentes, rendimiento y comisiones.'],
    desempeno:  ['Desempeño', 'Cómo viene cada asesor y su ficha de reunión, lista para descargar.'],
    revisiones: ['Revisiones', 'Tasaciones y cálculos pendientes de aprobar.'],
    sitio:      ['Sitio', 'Testimonios y solicitudes que llegan de la web.']
  };
  function ver(s){
    seccion = s;
    // Las herramientas dependen de la sección: buscar y ordenar solo en Equipo.
    var tools = document.getElementById('tools');
    tools.innerHTML = (s==='equipo')
      ? '<div class="ad-busca"><i class="fas fa-search"></i><input id="qEquipo" placeholder="Buscar agente..." oninput="filtrarEquipo()"></div>' +
        '<select class="ad-sel" id="ordenEquipo" onchange="filtrarEquipo()">' +
          '<option value="nombre">Nombre</option>' +
          '<option value="props">Más propiedades</option>' +
          '<option value="clis">Más clientes</option>' +
          '<option value="saldo">Mayor saldo</option>' +
        '</select>'
      : (s==='desempeno') ? dzHerramientas() : '';
    document.querySelectorAll('.ad-t').forEach(t => t.classList.remove('on'));
    var t = document.getElementById('t'+s.charAt(0).toUpperCase()+s.slice(1));
    if (t) t.classList.add('on');
    document.getElementById('titulo').textContent = TITULOS[s][0];
    document.getElementById('subtitulo').textContent = TITULOS[s][1];
    var c = document.getElementById('cuerpo');
    c.innerHTML = '<div class="cargando"><div class="sp"></div></div>';
    ({ bandeja: pintarBandeja, equipo: pintarEquipo, desempeno: pintarDesempeno, revisiones: pintarRevisiones, sitio: pintarSitio }[s] || pintarBandeja)(c);
  }

  // ---- Arranque ----
  // ---- Quién entra y qué puede hacer ----
  // Entra la Dirección: el CEO (también por su correo, como red de seguridad) y
  // la COO. La COO administra el equipo, pero no ve cargos, comisiones ni dinero
  // y puntos, y no puede hacer nada sobre alguien de su rango o superior.
  // Es la misma regla que aplican rangos.js y el servidor (traspasos, eliminar
  // cuentas y fichas se validan también allá).
  var miPerfil = {}, soyCEO = false;
  // Rango "de verdad": el CEO se reconoce también por su correo.
  function rangoEf(u){ return ((u && u.email) || '').toLowerCase() === ADMIN_EMAIL ? 'ceo' : ((u && u.rank) || ''); }
  function nivelEf(u){ var r = window.Rangos && Rangos.rango(rangoEf(u)); return r ? r.nivel : 0; }
  // Nadie se administra a sí mismo, al CEO no lo toca nadie, y la COO solo
  // administra a quien está por debajo de su rango.
  function puedoAdministrar(u){
    if (!u || !yo || u.id === yo.uid || rangoEf(u) === 'ceo') return false;
    if (soyCEO) return true;
    return nivelEf(miPerfil) > nivelEf(u);
  }
  function msgPermiso(e, defecto){
    var c = String((e && e.code) || '').replace(/^functions\//, '');
    if (c !== 'permission-denied') return defecto;
    var m = (e && e.message) || '';
    return (m && !/insufficient|missing or/i.test(m)) ? m : 'Tu usuario no tiene permiso para este cambio.';
  }

  auth.onAuthStateChanged(async function(u){
    if (!u){ location.href = 'index.html'; return; }
    var porCorreo = (u.email||'').toLowerCase() === ADMIN_EMAIL, fallo = false;
    try{
      var _p = await db.collection('users').doc(u.uid).get();
      miPerfil = _p.exists ? (_p.data() || {}) : {};
    }catch(e){ console.warn('perfil:', e); miPerfil = {}; fallo = true; }
    var aprobado = miPerfil.status === 'approved';
    soyCEO = porCorreo || (aprobado && miPerfil.rank === 'ceo');
    var soyDir = soyCEO || (aprobado && miPerfil.rank === 'coo');
    if (!soyDir){
      document.getElementById('cuerpo').innerHTML = fallo
        ? '<div class="vacio"><i class="fas fa-wifi"></i><h3>No se pudo verificar tu cuenta</h3><p>Revisá la conexión y recargá la página.</p></div>'
        : '<div class="vacio"><i class="fas fa-lock"></i><h3>Solo para la Dirección</h3><p>Esta sección no está disponible para tu cuenta.</p></div>';
      document.querySelector('.ad-nav').style.display='none';
      return;
    }
    yo = u;
    /* Abre la sección que venga en la dirección (admin.html#revisiones). Las
       notificaciones de la campanita mandan acá con la pestaña en el hash; antes
       el panel siempre arrancaba en Bandeja y había que buscar a mano.
       Formato: "seccion" o "sitio-solapa" (sitio-testimonios, sitio-postulaciones). */
    var _h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    var _partes = _h.split('-');
    var _sec = _partes[0];
    if (['bandeja','equipo','desempeno','revisiones','sitio'].indexOf(_sec) >= 0) {
      if (_sec === 'sitio' && _partes[1]) _stVer = _partes[1];
      ver(_sec);
    } else {
      ver('bandeja');
    }
    contadores();
  });
</script>
<script>
  // ==========================================================================
  // BANDEJA
  // --------------------------------------------------------------------------
  // Junta las notificaciones sin leer con lo que espera decisión aunque nadie
  // haya generado un aviso (agentes sin aprobar, testimonios sin publicar).
  // ==========================================================================
  var TIPOS = {
    despublicar_confirmar:{u:0,i:'fa-circle-stop',a:'Resolver',ir:n=>irProp(n)},
    ml_error:            {u:0,i:'fa-triangle-exclamation',a:'Ver',ir:n=>irProp(n)},
    refresh_token:       {u:0,i:'fa-key',a:'Reconectar',ir:()=>location.href='cuentas.html'},
    authorization_code:  {u:0,i:'fa-key',a:'Reconectar',ir:()=>location.href='cuentas.html'},
    retiro:              {u:0,i:'fa-money-bill-transfer',a:'Ver',ir:()=>location.href='retiros-admin.html'},
    admin_pendiente:     {u:1,i:'fa-user-clock',a:'Aprobar',ir:()=>ver('equipo')},
    new_user:            {u:1,i:'fa-user-plus',a:'Aprobar',ir:()=>ver('equipo')},
    ml_lead:             {u:1,i:'fa-comment-dots',a:'Ver',ir:n=>irProp(n)},
    consulta_infocasas:  {u:1,i:'fa-comment-dots',a:'Ver',ir:n=>irProp(n)},
    ficha_incompleta:    {u:1,i:'fa-clipboard-list',a:'Completar',ir:n=>n.propertyId&&(location.href='propiedad-form.html?id='+n.propertyId)},
    vencimiento_alquiler:{u:1,i:'fa-calendar-xmark',a:'Ver',ir:n=>irProp(n)},
    revision_rechazada:  {u:2,i:'fa-circle-xmark',a:'Ver',ir:()=>ver('revisiones')},
    crm_seguimiento:     {u:2,i:'fa-address-book',a:'Ver',ir:()=>location.href='clientes.html'},
    crm_pausa:           {u:2,i:'fa-circle-pause',a:'Ver',ir:()=>location.href='clientes.html'},
    baja_resuelta:       {u:2,i:'fa-circle-check',a:'Ver',ir:n=>irProp(n)},
    retiro_estado:       {u:2,i:'fa-receipt',a:'Ver',ir:()=>location.href='retiros-admin.html'}
  };
  var DEF = {u:2,i:'fa-bell',a:'Ver',ir:()=>{}};
  function irProp(n){ if(n && n.propertyId) location.href='propiedad.html?id='+n.propertyId; }

  var _bandeja = [];
  async function pintarBandeja(c){
    try{
      var [nots, pend, testi] = await Promise.all([
        db.collection('notifications').where('ownerId','==',yo.uid).get(),
        db.collection('users').where('status','==','pending').get(),
        db.collection('testimonials').where('approved','==',false).get()
      ]);
      // Las altas pendientes se muestran UNA sola vez. Abajo se arma un renglón
      // en vivo ("N agentes esperando aprobación") consultando users con status
      // pending: ese es el que vale, porque refleja el estado real y desaparece
      // solo al aprobar. Las notificaciones de alta cuentan el mismo hecho pero
      // son historia: quedan hasta que alguien las marca leídas, así que sumarlas
      // acá repetía el mismo pendiente dos veces.
      var items = nots.docs.map(d => ({id:d.id, ...d.data()}))
        .filter(n => !n.read)
        .filter(n => !(n.type === 'admin_pendiente' && n.subtipo === 'alta'))
        .map(n => {
        var t = TIPOS[n.type] || DEF;
        return { u:t.u, ico:t.i, accion:t.a,
          titulo: n.userName || n.propertyTitle || 'Aviso',
          sub: (n.text||'').slice(0,120), fecha: n.createdAt, _id:n.id, ir:()=>t.ir(n) };
      });
      if (pend.size) items.push({ u:1, ico:'fa-user-clock', accion:'Aprobar',
        titulo: pend.size+' agente'+(pend.size===1?'':'s')+' esperando aprobación',
        sub: pend.docs.map(d=>d.data().email||d.data().name).slice(0,3).join(' · '),
        ir:()=>ver('equipo') });
      if (testi.size) items.push({ u:2, ico:'fa-comment-dots', accion:'Revisar',
        titulo: testi.size+' testimonio'+(testi.size===1?'':'s')+' sin publicar',
        sub:'Llegaron desde el sitio público', ir:()=>ver('sitio') });

      items.sort((a,b) => (a.u-b.u) || String(b.fecha||'').localeCompare(String(a.fecha||'')));
      _bandeja = items;

      if (!items.length){
        c.innerHTML = '<div class="vacio"><i class="fas fa-circle-check" style="color:var(--ok)"></i><h3>Todo al día</h3><p>No hay nada esperando una decisión tuya.</p></div>';
        return;
      }
      var COL = ['alta','media','baja'];
      c.innerHTML = '<div class="card">' + items.map((x,i) =>
        '<div class="bd-row '+COL[x.u]+'"><span class="bd-dot"></span><i class="fas '+x.ico+' bd-ico"></i>' +
        '<div class="bd-txt"><b>'+esc(x.titulo)+'</b><span>'+esc(x.sub)+(x.fecha?' · '+hace(x.fecha):'')+'</span></div>' +
        '<button class="bd-btn" onclick="bandejaIr('+i+')">'+esc(x.accion)+'</button></div>').join('') + '</div>';
    }catch(e){
      console.error(e);
      c.innerHTML = '<div class="vacio"><i class="fas fa-triangle-exclamation"></i><h3>No se pudo cargar</h3><p>'+esc(e.message||e)+'</p></div>';
    }
  }
  function bandejaIr(i){
    var x = _bandeja[i]; if(!x) return;
    // Marcar leída al resolver: si no, la bandeja nunca se vacía.
    if (x._id) db.collection('notifications').doc(x._id).update({read:true}).catch(()=>{});
    try{ x.ir(); }catch(e){ console.warn(e); }
  }

  // ==========================================================================
  // EQUIPO
  // ==========================================================================
  var _agentes = [];
  async function pintarEquipo(c){
    try{
      // Las cuatro métricas salen de tres consultas. Clientes se cuenta acá
      // porque sin ese dato "1 propiedad" no distingue al que no trabaja del
      // que trabaja y todavía no cerró.
      var [us, props, clis, cfg] = await Promise.all([
        db.collection('users').get(),
        db.collection('properties').get(),
        db.collection('clients').get(),
        db.collection('adminData').doc('comisiones').get().catch(()=>null)
      ]);
      var propsPorAgente = {}, clisPorAgente = {};
      props.docs.forEach(d => { var p=d.data(); if(p.ownerId) propsPorAgente[p.ownerId]=(propsPorAgente[p.ownerId]||0)+1; });
      clis.docs.forEach(d => { var x=d.data(); if(x.archived) return; if(x.createdBy) clisPorAgente[x.createdBy]=(clisPorAgente[x.createdBy]||0)+1; });

      var todos = us.docs.map(d => ({id:d.id, ...d.data()}));
      var pendientes = todos.filter(u => u.status==='pending');
      // Los que no tienen acceso van al final: siguen en la lista por su historial.
      var equipo = todos.filter(u => u.status!=='pending').sort((a,b) =>
        ((a.email||'').toLowerCase()===ADMIN_EMAIL ? -1 : (b.email||'').toLowerCase()===ADMIN_EMAIL ? 1
          : ((a.status==='rejected')-(b.status==='rejected')) || (a.name||'').localeCompare(b.name||'','es',{sensitivity:'base'})));
      _agentes = todos;
      var b=document.getElementById('cEquipo');
      b.textContent = pendientes.length || ''; b.style.display = pendientes.length ? '' : 'none';

      // Se guardan para poder filtrar y ordenar sin volver a consultar.
      _eqDatos = { equipo:equipo, props:propsPorAgente, clis:clisPorAgente };
      var html = '';
      if (pendientes.length){
        html += '<div class="ad-sec"><span>Esperando aprobación</span><b>'+pendientes.length+'</b><i></i></div><div class="card">' +
          pendientes.map(u =>
            '<div class="row">'+avatar(u)+
            '<div class="id"><div class="id-n"><b>'+esc(u.name||'Sin nombre')+'</b><span class="chip warn">Pendiente</span></div>' +
            '<div class="id-s">'+esc(u.email||'')+(u.createdAt?' · solicitó '+hace(u.createdAt):'')+'</div></div>' +
            (puedoAdministrar(u)
              ? '<button class="bd-btn" onclick="aprobar(\''+escA(u.id)+'\')">Aprobar</button>' +
                '<button class="kb" onclick="menuPendiente(event,\''+escA(u.id)+'\')"><i class="fas fa-ellipsis-vertical"></i></button>'
              : '') +
            '</div>').join('') + '</div>';
      }

      // Totales del equipo: el dato que un dueño mira primero y que hoy había que
      // sumar a mano recorriendo las filas.
      var tProps = Object.values(propsPorAgente).reduce((a,b)=>a+b,0);
      var tClis  = Object.values(clisPorAgente).reduce((a,b)=>a+b,0);
      var tSaldo = equipo.reduce((a,u)=>a+(Number(u.saldoUSD)||0),0);
      var sinAct = equipo.filter(u => u.status!=='rejected' && !(propsPorAgente[u.id]||0) && !(clisPorAgente[u.id]||0)).length;
      html += '<div class="resumen">' +
        '<div class="rs"><b>'+equipo.filter(u => u.status!=='rejected').length+'</b><span>Agentes</span></div>' +
        '<div class="rs"><b>'+tProps+'</b><span>Propiedades</span></div>' +
        '<div class="rs"><b>'+tClis+'</b><span>Clientes</span></div>' +
        '<div class="rs"><b'+(tSaldo>0?' class="ok"':'')+'>'+(tSaldo>0?plata(tSaldo,'USD'):'—')+'</b><span>A cobrar</span></div>' +
        (sinAct?'<div class="rs"><b class="warn">'+sinAct+'</b><span>Sin actividad</span></div>':'') +
      '</div>';
      html += '<div class="ad-sec"><span>Equipo</span><b>'+equipo.length+'</b><i></i></div>' +
        '<div class="card" id="eqLista">' + equipo.map(u => fila(u, propsPorAgente[u.id]||0, clisPorAgente[u.id]||0)).join('') + '</div>';

      var d = (cfg && cfg.exists) ? cfg.data() : {};
      if (soyCEO) html += '<div class="ad-sec"><span>Comisión de la agencia</span><i></i></div>' +
        '<div class="card" style="padding:16px 18px">' +
        '<p style="font-size:.83rem;color:var(--muted);margin:0 0 13px;line-height:1.5">Se aplica a los agentes que no tengan una comisión propia configurada.</p>' +
        '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">' +
        '<label style="display:inline-flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600">Venta <input type="number" id="cfgSale" value="'+(d.agencyPctSale!=null?d.agencyPctSale:3)+'" step="0.1" style="width:76px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit"> %</label>' +
        '<label style="display:inline-flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600">Alquiler <input type="number" id="cfgRent" value="'+(d.agencyMonthsRent!=null?d.agencyMonthsRent:1)+'" step="0.1" style="width:76px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit"> meses</label>' +
        '<button class="bd-btn" onclick="guardarComision()"><i class="fas fa-floppy-disk"></i> Guardar</button></div></div>';
      c.innerHTML = html;
    }catch(e){
      console.error(e);
      c.innerHTML = '<div class="vacio"><i class="fas fa-triangle-exclamation"></i><h3>No se pudo cargar</h3><p>'+esc(e.message||e)+'</p></div>';
    }
  }

  var _acciones = {};
  function menuPendiente(ev, id){
    abrirMenu(ev, [{ico:'fa-xmark', txt:'Rechazar solicitud', mal:1, fn:function(){ rechazar(id); }}]);
  }
  function menuAgente(ev, id){ abrirMenu(ev, _acciones[id] || []); }
  // Qué puede hacer el que mira sobre esta persona. Lo del organigrama y la plata
  // (cargo, comisión, dinero y puntos) es solo del CEO: a la COO ni le aparece.
  function accionesDe(u, esAdminFila){
    var id = u.id, puedo = puedoAdministrar(u), acc = [];
    if (soyCEO || puedo) acc.push({ico:'fa-pen', txt:'Editar datos', fn:function(){ editar(id); }});
    if (soyCEO){
      acc.push({ico:'fa-id-badge', txt:'Cargo y rango', fn:function(){ panelRango(id); }});
      acc.push({ico:'fa-percent', txt:'Comisión', fn:function(){ comision(id); }});
      acc.push({ico:'fa-wallet', txt:'Dinero y puntos', fn:function(){ finanzas(id); }});
    }
    if (puedo && u.status === 'approved') acc.push({ico:'fa-clipboard-list', txt:'Ficha de reunión', fn:function(){ abrirFicha(id); }});
    if (puedo && !esAdminFila) acc.push({ico:'fa-right-left', txt:'Transferir cartera', fn:function(){ traspasar(id); }});
    acc.push({ico:'fa-eye', txt:'Ver perfil público', fn:function(){ window.open('index.html#perfil/'+id,'_blank'); }});
    if (puedo && !esAdminFila && u.status === 'approved') acc.push({ico:'fa-user-lock', txt:'Quitar acceso', fn:function(){ quitarAcceso(id); }});
    if (puedo && !esAdminFila && u.status === 'rejected') acc.push({ico:'fa-user-check', txt:'Devolver acceso', fn:function(){ devolverAcceso(id); }});
    if (puedo && !esAdminFila) acc.push({ico:'fa-trash', txt:'Eliminar', mal:1, fn:function(){ eliminar(id); }});
    return acc;
  }
  // Quitar el acceso es lo que conviene cuando alguien se va: no entra más y
  // se conserva todo su historial. Se puede devolver.
  async function quitarAcceso(id){
    var u = agente(id); if (!u || !puedoAdministrar(u)) return;
    if (!confirm('¿Quitarle el acceso a ' + (u.name || u.email || 'este agente') + '?\n\nNo va a poder entrar al CRM. Sus clientes, propiedades y cierres quedan como están: si se va, transferí antes su cartera.\n\nEl acceso se le puede devolver cuando quieras.')) return;
    try{ await db.collection('users').doc(id).update({status:'rejected'}); toast('Acceso quitado'); ver('equipo'); }
    catch(e){ console.error(e); toast(msgPermiso(e, 'No se pudo quitar el acceso')); }
  }
  async function devolverAcceso(id){
    var u = agente(id); if (!u || !puedoAdministrar(u)) return;
    try{ await db.collection('users').doc(id).update({status:'approved'}); toast('Acceso devuelto'); ver('equipo'); }
    catch(e){ console.error(e); toast(msgPermiso(e, 'No se pudo devolver el acceso')); }
  }
  function avatar(u){
    return '<div class="av">'+(u.profilePhoto?'<img src="'+escA(u.profilePhoto)+'" alt="">':esc(iniciales(u.name)))+'</div>';
  }
  function fila(u, nProps, nClis){
    var admin = (u.email||'').toLowerCase()===ADMIN_EMAIL;
    // Un agente sin nada cargado es lo que un dueño quiere ver de un vistazo.
    var quieto = !admin && u.status !== 'rejected' && !nProps && !nClis;
    var saldo = Number(u.saldoUSD||0);
    // Sin comisión propia hereda la de la agencia: se muestra para que no
    // parezca un dato faltante.
    var cs = u.commissionSale!=null?u.commissionSale:(u.commissionPct!=null?u.commissionPct:null);
    var cr = u.commissionRent!=null?u.commissionRent:(u.commissionPct!=null?u.commissionPct:null);
    var com = (cs!=null||cr!=null) ? (cs!=null?cs:'—')+' / '+(cr!=null?cr:'—') : 'Agencia';
    // Se guardan por id y se resuelven al hacer clic: así el dato nunca viaja
    // dentro de una cadena de HTML.
    _acciones[u.id] = accionesDe(u, admin);
    return '<div class="row">'+avatar(u)+
      '<div class="id"><div class="id-n"><b>'+esc(u.name||'Sin nombre')+'</b>' +
        (admin?'<span class="chip oro">Admin</span>':chipRango(u)) +
        (u.status==='rejected'?'<span class="chip gris">Sin acceso</span>':'') +
        (quieto?'<span class="chip warn">Sin actividad</span>':'') +
      '</div><div class="id-s">'+esc(u.email||'')+'</div></div>' +
      '<div class="mets">' +
        '<div class="met"><b'+(nProps?'':' class="nada"')+'>'+(nProps||'—')+'</b><span>Propiedades</span></div>' +
        '<div class="met"><b'+(nClis?'':' class="nada"')+'>'+(nClis||'—')+'</b><span>Clientes</span></div>' +
        '<div class="met"><b'+(saldo>0?' class="ok"':' class="nada"')+'>'+(saldo>0?plata(saldo,'USD'):'—')+'</b><span>A cobrar</span></div>' +
        '<div class="met"><b>'+esc(com)+'</b><span>Comisión</span></div>' +
      '</div>' +
      '<button class="kb" onclick="menuAgente(event,\''+escA(u.id)+'\')"><i class="fas fa-ellipsis-vertical"></i></button>' +
      '</div>';
  }

  var _eqDatos = null;
  function filtrarEquipo(){
    if (!_eqDatos) return;
    var q = (document.getElementById('qEquipo')||{}).value || '';
    q = q.trim().toLowerCase();
    var orden = (document.getElementById('ordenEquipo')||{}).value || 'nombre';
    var lista = _eqDatos.equipo.filter(u =>
      !q || (u.name||'').toLowerCase().indexOf(q)>=0 || (u.email||'').toLowerCase().indexOf(q)>=0 || (u.role||'').toLowerCase().indexOf(q)>=0);
    var P = _eqDatos.props, C = _eqDatos.clis;
    lista.sort(function(a,b){
      if (orden==='props') return (P[b.id]||0)-(P[a.id]||0) || (a.name||'').localeCompare(b.name||'','es');
      if (orden==='clis')  return (C[b.id]||0)-(C[a.id]||0) || (a.name||'').localeCompare(b.name||'','es');
      if (orden==='saldo') return (Number(b.saldoUSD)||0)-(Number(a.saldoUSD)||0) || (a.name||'').localeCompare(b.name||'','es');
      // Por nombre: el admin primero, es la referencia de la lista; los que no tienen acceso, al final.
      var ad = (a.email||'').toLowerCase()===ADMIN_EMAIL, bd = (b.email||'').toLowerCase()===ADMIN_EMAIL;
      if (ad!==bd) return ad ? -1 : 1;
      var ra = a.status==='rejected', rb = b.status==='rejected';
      if (ra!==rb) return ra ? 1 : -1;
      return (a.name||'').localeCompare(b.name||'','es',{sensitivity:'base'});
    });
    var cont = document.getElementById('eqLista');
    if (!cont) return;
    cont.innerHTML = lista.length
      ? lista.map(u => fila(u, P[u.id]||0, C[u.id]||0)).join('')
      : '<div class="vacio" style="padding:36px"><i class="fas fa-user-slash"></i><h3>Sin resultados</h3><p>Probá con otro nombre.</p></div>';
  }

  async function aprobar(id){
    var u = agente(id); if (u && !puedoAdministrar(u)) return;
    try{ await db.collection('users').doc(id).update({status:'approved'}); toast('Agente aprobado'); ver('equipo'); contadores(); }
    catch(e){ toast(msgPermiso(e, 'No se pudo aprobar')); }
  }
  async function rechazar(id){
    var u = agente(id); if (u && !puedoAdministrar(u)) return;
    if(!confirm('¿Rechazar esta solicitud? La cuenta no va a poder entrar.')) return;
    try{ await db.collection('users').doc(id).update({status:'rejected'}); toast('Solicitud rechazada'); ver('equipo'); contadores(); }
    catch(e){ toast(msgPermiso(e, 'No se pudo rechazar')); }
  }

  // ---- Traspaso de cartera ----------------------------------------------
  // Cuando un agente se va, sus propiedades, clientes y gestiones pasan a otro.
  // Lo que no se ve pero importa: los avisos ya publicados en Mercado Libre
  // guardan adentro el teléfono del agente que los creó, así que el traspaso
  // también empuja el contacto nuevo aviso por aviso. InfoCasas y el CRM leen el
  // dueño en cada consulta, así que ahí se corrige solo.
  function traspasar(id){
    var u = agente(id); if(!u || !puedoAdministrar(u)) return;
    // Destino: solo cuentas que pueden trabajar (aprobadas, o el CEO).
    var otros = _agentes.filter(function(a){
      return a.id !== id && (a.status === 'approved' || (a.email||'').toLowerCase() === ADMIN_EMAIL);
    });
    if(!otros.length){ toast('No hay otro agente al que transferirle'); return; }
    var opts = otros.map(function(a){
      return '<option value="'+escA(a.id)+'">'+esc(a.name||a.email||'Agente')+'</option>';
    }).join('');
    abrirPanel('Transferir cartera de '+(u.name||'agente'),
      '<p class="cp-nota" style="margin-top:0">Todo lo que esté a nombre de <b>'+esc(u.name||u.email||'')+
      '</b> pasa al agente que elijas. Los avisos publicados en Mercado Libre se actualizan con el teléfono del agente nuevo.</p>'+
      '<label class="cp"><span>Nuevo responsable</span><select id="trDestino">'+opts+'</select></label>'+
      '<label class="cp cpk"><input type="checkbox" id="trProps" checked><span>Propiedades</span></label>'+
      '<label class="cp cpk"><input type="checkbox" id="trClis" checked><span>Clientes</span></label>'+
      '<label class="cp cpk"><input type="checkbox" id="trGest" checked><span>Gestiones</span></label>'+
      '<p class="cp-nota">Puede demorar si hay muchos avisos publicados: cada uno se actualiza por separado.</p>',
      function(){ return confirmarTraspaso(id); });
  }

  async function confirmarTraspaso(deId){
    var destino = document.getElementById('trDestino').value;
    var mueve = {
      propiedades: document.getElementById('trProps').checked,
      clientes: document.getElementById('trClis').checked,
      gestiones: document.getElementById('trGest').checked
    };
    if(!mueve.propiedades && !mueve.clientes && !mueve.gestiones){ toast('Elegí al menos una cosa para transferir'); return; }
    var r;
    try{ r = await firebase.functions().httpsCallable('traspasarCartera')({ deUid: deId, aUid: destino, mueve: mueve }); }
    catch(e){ console.error(e); toast((e && e.message) || 'No se pudo transferir'); return; }
    var d = r.data || {};
    cerrarPanel();
    var partes = [];
    if(d.propiedades) partes.push(d.propiedades+' propiedad'+(d.propiedades===1?'':'es'));

    if(d.gestiones) partes.push(d.gestiones+' gestión'+(d.gestiones===1?'':'es'));

  function agente(id){ for(var i=0;i<_agentes.length;i++) if(_agentes[i].id===id) return _agentes[i]; return null; }
  function cerrarPanel(){ var p=document.querySelector('.slide'); if(p) p.remove(); }
  // `guardar` es una FUNCIÓN, no un texto. Antes se metía como texto dentro de
  // onclick="..." y el id del agente venía entre comillas dobles: cerraban el
  // atributo y el botón quedaba muerto. Acá se ata con addEventListener.
  function abrirPanel(titulo, cuerpo, guardar){
    cerrarPanel();
    var w=document.createElement('div');
    w.className='slide';
    w.onclick=function(e){ if(e.target===w) cerrarPanel(); };
    w.innerHTML='<div class="slide-box"><div class="slide-h"><b>'+esc(titulo)+'</b>'+
      '<button class="kb" data-cerrar><i class="fas fa-xmark"></i></button></div>'+
      '<div class="slide-b">'+cuerpo+'</div>'+
      (guardar?'<div class="slide-f"><button class="bd-btn" data-cerrar>Cancelar</button>'+
        '<button class="bd-btn pri" data-guardar>Guardar</button></div>':'')+'</div>';
    document.body.appendChild(w);
    w.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', cerrarPanel));
    var g = w.querySelector('[data-guardar]');
    if (g && guardar) g.addEventListener('click', function(){
      g.disabled = true; g.textContent = 'Guardando...';
      Promise.resolve(guardar()).catch(function(e){
        console.error(e); toast('No se pudo guardar');
      }).then(function(){ if(document.body.contains(g)){ g.disabled=false; g.textContent='Guardar'; } });
    });
  }

  // ==========================================================================
  // REVISIONES y SITIO — por ahora redirigen al panel viejo, que ya las tiene
  // funcionando. Se migran en el próximo paso.
  // ==========================================================================
  // ===== Revisiones =====
  // Tasaciones, gastos y cálculos de terreno que los agentes mandan a aprobar.
  // OJO con el modelo de datos: NO hay una colección 'tasaciones'. Cada cálculo
  // se guarda como una entrada de un MAPA dentro del documento del agente
  // (users/{uid}.tasaciones = { id: registro }). Por eso hay que leer los
  // usuarios y recorrer los mapas: no se puede consultar por 'pendientes'.
  // Con once agentes se banca; si el equipo crece mucho, conviene moverlas a su
  // propia colección.
  var REV_TIPOS = {
    tasaciones:   { label:'Tasación',            ico:'fa-calculator',            col:'#c9a227' },
    calcGastos:   { label:'Gastos y comisiones', ico:'fa-file-invoice-dollar',   col:'#2e86de' },
    calcTerrenos: { label:'Cálculo de terreno',  ico:'fa-mountain-sun',          col:'#27ae60' }
  };
  var _revs = [];

  async function pintarRevisiones(c){
    c.innerHTML = '<div class="cargando"><div class="sp"></div></div>';
    try{
      var us = await db.collection('users').get();
      _revs = [];
      us.docs.forEach(function(d){
        var u = d.data() || {};
        Object.keys(REV_TIPOS).forEach(function(campo){
          var mapa = u[campo];
          if (!mapa || typeof mapa !== 'object') return;
          Object.keys(mapa).forEach(function(id){
            var r = mapa[id]; if (!r || typeof r !== 'object') return;
            _revs.push(Object.assign({}, r, {
              _uid: d.id, _campo: campo, _id: id,
              _agente: r.agenteNombre || u.name || u.email || 'Agente'
            }));
          });
        });
      });
      // Primero lo que espera decisión, y dentro de eso lo más nuevo arriba.
      _revs.sort(function(a,b){
        var pa = (!a.revisado && !a.rechazada) ? 0 : 1;
        var pb = (!b.revisado && !b.rechazada) ? 0 : 1;
        if (pa !== pb) return pa - pb;
        return String(b.fecha||b.creadoAt||'').localeCompare(String(a.fecha||a.creadoAt||''));
      });
      renderRevs(c);
    }catch(e){
      console.error(e);
      c.innerHTML = '<div class="vacio"><i class="fas fa-triangle-exclamation"></i><h3>No se pudieron cargar</h3><p>'+esc(e.message||'')+'</p></div>';
    }
  }

  function renderRevs(c){
    var pend = _revs.filter(function(r){ return !r.revisado && !r.rechazada; });
    if (!_revs.length){
      c.innerHTML = '<div class="vacio"><i class="fas fa-clipboard-check"></i><h3>Sin revisiones</h3><p>Cuando un agente mande una tasación o un cálculo, aparece acá.</p></div>';
      return;
    }
    var h = '';
    if (pend.length){
      h += '<div class="rev-alerta"><i class="fas fa-bell"></i> <b>'+pend.length+'</b> '+
           (pend.length===1?'cálculo espera tu revisión':'cálculos esperan tu revisión')+
           ' — hasta que los apruebes, el agente no puede descargar el PDF.</div>';
    }
    h += '<div class="rev-lista">' + _revs.map(filaRev).join('') + '</div>';
    c.innerHTML = h;
  }

  function filaRev(r){
    var t = REV_TIPOS[r._campo] || { label:'Cálculo', ico:'fa-file', col:'#8a929c' };
    var val = r.resultado && r.resultado.valor;
    var estado = r.rechazada
      ? '<span class="rev-chip no"><i class="fas fa-circle-xmark"></i> Rechazada</span>'
      : (r.revisado ? '<span class="rev-chip si"><i class="fas fa-circle-check"></i> Aprobada</span>'
                    : '<span class="rev-chip pend"><i class="fas fa-clock"></i> Pendiente</span>');
    var dato = (r.datos && (r.datos.direccion || r.datos.cliente)) || '';
    var acciones = (r.revisado || r.rechazada)
      ? '<button class="rev-b" onclick="revMarcar(\''+r._uid+'\',\''+r._campo+'\',\''+esc(r._id)+'\',false)">Volver a pendiente</button>'
      : '<button class="rev-b ok" onclick="revMarcar(\''+r._uid+'\',\''+r._campo+'\',\''+esc(r._id)+'\',true)"><i class="fas fa-check"></i> Aprobar</button>'+
        '<button class="rev-b no" onclick="revRechazar(\''+r._uid+'\',\''+r._campo+'\',\''+esc(r._id)+'\')">Rechazar</button>';
    var pdf = r.pdfUrl ? '<a class="rev-b" href="'+escA(r.pdfUrl)+'" target="_blank" rel="noopener"><i class="fas fa-file-pdf"></i> PDF</a>' : '';
    return '<div class="rev-item'+((!r.revisado&&!r.rechazada)?' pend':'')+'">'+
      '<div class="rev-ico" style="background:'+t.col+'1a;color:'+t.col+'"><i class="fas '+t.ico+'"></i></div>'+
      '<div class="rev-cuerpo">'+
        '<div class="rev-tit">'+esc(t.label)+(val?' · US$ '+Number(val).toLocaleString('es-UY'):'')+' '+estado+'</div>'+
        '<div class="rev-sub">'+esc(r._agente)+(dato?' · '+esc(dato):'')+(r.fecha?' · '+esc(r.fecha):'')+'</div>'+
        (r.motivoRechazo?'<div class="rev-motivo">Motivo: '+esc(r.motivoRechazo)+'</div>':'')+
      '</div>'+
      '<div class="rev-acc">'+pdf+acciones+'</div>'+
    '</div>';
  }

  async function revMarcar(uid, campo, id, valor){
    try{
      var parche = {}; 
      parche[campo+'.'+id+'.revisado'] = valor;
      parche[campo+'.'+id+'.rechazada'] = false;
      parche[campo+'.'+id+'.motivoRechazo'] = '';
      await db.collection('users').doc(uid).update(parche);
      _revs.forEach(function(r){ if(r._uid===uid && r._campo===campo && r._id===id){ r.revisado=valor; r.rechazada=false; r.motivoRechazo=''; } });
      renderRevs(document.getElementById('cuerpo'));
      toast(valor ? 'Aprobada' : 'Vuelta a pendiente');
      contadores();
    }catch(e){ console.error(e); toast('No se pudo guardar'); }

  async function revRechazar(uid, campo, id){
    var motivo = prompt('¿Por qué se rechaza? El agente va a ver este motivo.');
    if (motivo === null) return;
    if (!String(motivo).trim()) { toast('Escribí un motivo'); return; }
    try{
      var parche = {};
      parche[campo+'.'+id+'.revisado'] = false;
      parche[campo+'.'+id+'.rechazada'] = true;
      parche[campo+'.'+id+'.motivoRechazo'] = String(motivo).trim();
      parche[campo+'.'+id+'.rechazadaAt'] = new Date().toISOString();
      await db.collection('users').doc(uid).update(parche);
      _revs.forEach(function(r){ if(r._uid===uid && r._campo===campo && r._id===id){ r.revisado=false; r.rechazada=true; r.motivoRechazo=String(motivo).trim(); } });
      renderRevs(document.getElementById('cuerpo'));
      toast('Rechazada');
      contadores();
    }catch(e){ console.error(e); toast('No se pudo guardar'); }
  }

  /* ===== SITIO: testimonios y solicitudes de venta =====
     Antes esta pestaña era un cartel que mandaba al panel anterior. Los botones
     de aprobar, despublicar y eliminar existían, pero solo en index.html#admin,
     así que había que saltar de un panel a otro para moderar un testimonio.

     Las dos cosas llegan del sitio público, por eso comparten pestaña con dos
     solapas: Testimonios (testimonials) y Solicitudes de venta (leadsVenta). */

  var _stVer = 'testimonios', _stTesti = [], _stSol = [], _stSolF = 'nuevo', _stPost = [];

  function _stMs(v){
    if(!v) return 0;
    if(typeof v==='object' && typeof v.toDate==='function') return v.toDate().getTime();
    if(typeof v==='object' && v.seconds) return v.seconds*1000;
    var d=new Date(v); return isNaN(d.getTime())?0:d.getTime();
  }
  function _stFecha(v){
    var ms=_stMs(v);
    return ms ? new Date(ms).toLocaleString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  }
  function _stWa(tel){
    var d=String(tel||'').replace(/\D/g,'');
    if(!d) return '';
    if(d.indexOf('598')===0) return d;
    if(d.charAt(0)==='0') d=d.slice(1);
    return d.length<=9 ? '598'+d : d;
  }
  var _ST_TIPO={casa:'Casa',apartamento:'Apartamento',terreno:'Terreno',local:'Local',oficina:'Oficina',galpon:'Galpón',campo:'Campo',otro:'Otro'};

  async function pintarSitio(c){
    c.innerHTML = '<div class="ad-sec"><span>Cargando…</span><i></i></div>';
    try{
      var [ts, ls, ps] = await Promise.all([
        db.collection('testimonials').get(),
        db.collection('leadsVenta').get().catch(function(){ return null; }),
        // Solo el CEO puede leerlas: si es la COO, la consulta falla y la solapa
        // queda vacía en vez de romper la pestaña entera.
        soyCEO ? db.collection('postulaciones').get().catch(function(){ return null; }) : Promise.resolve(null)
      ]);
      _stTesti = ts.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      // Los pendientes primero: es lo único que pide una decisión.
      _stTesti.sort(function(a,b){
        if(!!a.approved !== !!b.approved) return a.approved ? 1 : -1;
        return _stMs(b.createdAt) - _stMs(a.createdAt);
      });
      _stSol = ls ? ls.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }) : [];
      _stSol.sort(function(a,b){ return _stMs(b.createdAt) - _stMs(a.createdAt); });
      _stPost = ps ? ps.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }) : [];
      _stPost.sort(function(a,b){ return _stMs(b.createdAt) - _stMs(a.createdAt); });
    }catch(e){
      c.innerHTML = '<div class="vacio"><i class="fas fa-lock"></i><h3>No se pudo cargar</h3><p>'+
        esc(e.code==='permission-denied' ? 'Sin permiso para leer testimonios o solicitudes.' : (e.message||e))+'</p></div>';
      return;
    }
    renderSitio(c);
  }

  function renderSitio(c){
    c = c || document.getElementById('cuerpo');
    if (_stVer === 'postulaciones' && !soyCEO) _stVer = 'testimonios';
    var pend = _stTesti.filter(function(t){ return !t.approved; }).length;
    var nuevas = _stSol.filter(function(l){ return (l.estado||'nuevo')==='nuevo'; }).length;
    var postNuevas = _stPost.filter(function(x){ return (x.estado||'nueva')==='nueva'; }).length;
    var html = '<div class="st-tabs">'+
      '<button class="st-tab'+(_stVer==='testimonios'?' on':'')+'" onclick="sitioVerTab(\'testimonios\')">'+
        '<i class="fas fa-comment-dots"></i> Testimonios'+(pend?' <b>'+pend+'</b>':'')+'</button>'+
      '<button class="st-tab'+(_stVer==='solicitudes'?' on':'')+'" onclick="sitioVerTab(\'solicitudes\')">'+
        '<i class="fas fa-inbox"></i> Solicitudes de venta'+(nuevas?' <b>'+nuevas+'</b>':'')+'</button>'+
      (soyCEO ? '<button class="st-tab'+(_stVer==='postulaciones'?' on':'')+'" onclick="sitioVerTab(\'postulaciones\')">'+
        '<i class="fas fa-user-tie"></i> Postulaciones'+(postNuevas?' <b>'+postNuevas+'</b>':'')+'</button>' : '')+
      '</div><div id="stCuerpo"></div>';
    c.innerHTML = html;
    if(_stVer==='testimonios') renderTestis();
    else if(_stVer==='postulaciones') renderPost();
    else renderSols();
  }

  function sitioVerTab(v){ _stVer=v; renderSitio(); }

  function renderTestis(){
    var c=document.getElementById('stCuerpo'); if(!c) return;
    if(!_stTesti.length){
      c.innerHTML='<div class="vacio"><i class="fas fa-comment-dots"></i><h3>Sin testimonios</h3>'+
        '<p>Cuando alguien deje uno desde el sitio, aparece acá para que lo revises.</p></div>';
      return;
    }
    var pend=_stTesti.filter(function(t){return !t.approved;});
    var pub=_stTesti.filter(function(t){return t.approved;});
    var tarjeta=function(t){
      var donde = t.target==='agent' ? ('Perfil de '+(t.agentName||'agente')) : 'Inicio';
      var estado = t.approved
        ? '<span class="chip ok">Publicado</span>'
        : '<span class="chip warn">Pendiente</span>';
      var acciones = (t.approved
        ? '<button class="bd-btn" onclick="stDespublicar(\''+escA(t.id)+'\')">Despublicar</button>'
        : '<button class="bd-btn pri" onclick="stAprobar(\''+escA(t.id)+'\')">Aprobar</button>')+
        '<button class="bd-btn" onclick="stBorrar(\''+escA(t.id)+'\')"><i class="fas fa-trash"></i></button>';
      return '<div class="st-card">'+
        '<div class="st-h"><b>'+esc(t.name||'Anónimo')+'</b>'+
          (t.role?'<span class="st-rol">'+esc(t.role)+'</span>':'')+
          estado+'<span class="st-when">'+esc(_stFecha(t.createdAt))+'</span></div>'+
        '<div class="st-txt">'+esc(t.text||'')+'</div>'+
        '<div class="st-f"><span class="st-donde"><i class="fas fa-map-pin"></i> '+esc(donde)+'</span>'+
          '<span class="st-acts">'+acciones+'</span></div></div>';
    };
    var html='';
    if(pend.length) html += '<div class="ad-sec"><span>Esperando revisión</span><b>'+pend.length+'</b><i></i></div>'+pend.map(tarjeta).join('');
    if(pub.length)  html += '<div class="ad-sec"><span>Publicados</span><b>'+pub.length+'</b><i></i></div>'+pub.map(tarjeta).join('');
    c.innerHTML=html;
  }

  async function stAprobar(id){
    try{
      await db.collection('testimonials').doc(id).update({approved:true});
      var t=_stTesti.find(function(x){return x.id===id;}); if(t) t.approved=true;
      _stTesti.sort(function(a,b){ if(!!a.approved!==!!b.approved) return a.approved?1:-1; return _stMs(b.createdAt)-_stMs(a.createdAt); });
      renderSitio(); toast('Publicado'); contadores();
    }catch(e){ console.error(e); toast('No se pudo publicar'); }

  async function stDespublicar(id){
    try{
      await db.collection('testimonials').doc(id).update({approved:false});
      var t=_stTesti.find(function(x){return x.id===id;}); if(t) t.approved=false;

  async function stBorrar(id){
    // Borrar es definitivo y no hay papelera para testimonios: se confirma.

    try{
      await db.collection('testimonials').doc(id).delete();

  /* POSTULACIONES — "Trabajá con nosotros".
     Solo las ve el CEO: traen datos personales de gente que no es cliente ni
     agente, y la decisión de contratar es suya. */
  var _ST_EXP_ORDEN = { 'Más de 3 años':0, '1 a 3 años':1, 'Menos de 1 año':2, 'Sin experiencia':3 };

  function renderPost(){
    var c=document.getElementById('stCuerpo'); if(!c) return;
    if(!_stPost.length){
      c.innerHTML='<div class="vacio"><i class="fas fa-user-tie"></i><h3>Sin postulaciones</h3>'+
        '<p>Las que lleguen desde <b>Trabajá con nosotros</b> aparecen acá.</p></div>';

    }
    var nuevas=_stPost.filter(function(x){return (x.estado||'nueva')==='nueva';});
    var vistas=_stPost.filter(function(x){return (x.estado||'nueva')!=='nueva';});
    var tarjeta=function(x){
      var nueva=(x.estado||'nueva')==='nueva';
      var wa=_stWa(x.telefono);
      var r='';
      r+='<div class="st-row"><span class="lbl">Teléfono</span><span>'+esc(x.telefono||'—')+'</span></div>';
      if(x.email) r+='<div class="st-row"><span class="lbl">Correo</span><span><a href="mailto:'+esc(x.email)+'">'+esc(x.email)+'</a></span></div>';
      if(x.experiencia) r+='<div class="st-row"><span class="lbl">Experiencia</span><span>'+esc(x.experiencia)+'</span></div>';
      if(x.mensaje) r+='<div class="st-row"><span class="lbl">Mensaje</span><span>'+esc(x.mensaje)+'</span></div>';
      var f='';
      if(wa) f+='<a class="bd-btn" href="https://wa.me/'+wa+'" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> WhatsApp</a>';
      /* El CV se descarga con un clic: se guardó la RUTA, no la URL, porque
         pedir la URL desde la web pública es una lectura que solo el admin
         puede hacer. Acá sí tenemos permiso, así que se resuelve al vuelo. */
      if(x.cvRuta) f+='<button class="bd-btn pri" onclick="stVerCv(\''+escA(x.cvRuta)+'\',this)"><i class="fas fa-file-arrow-down"></i> Ver CV</button>';
      if(nueva) f+='<button class="bd-btn" onclick="stPostEstado(\''+escA(x.id)+'\',\'vista\')">Marcar vista</button>';
      else f+='<button class="bd-btn" onclick="stPostEstado(\''+escA(x.id)+'\',\'nueva\')">Marcar sin ver</button>';
      f+='<button class="bd-btn" onclick="stPostBorrar(\''+escA(x.id)+'\')"><i class="fas fa-trash"></i></button>';
      return '<div class="st-card"><div class="st-h"><b>'+esc(x.nombre||'(sin nombre)')+'</b>'+
        (nueva?'<span class="chip warn">Nueva</span>':'<span class="chip">Vista</span>')+
        (x.cvNombre?'<span class="chip" title="'+escA(x.cvNombre)+'"><i class="fas fa-paperclip"></i> CV</span>':'')+
        '<span class="st-when">'+esc(_stFecha(x.createdAt))+'</span></div>'+
        '<div class="st-rows">'+r+'</div><div class="st-f"><span class="st-acts">'+f+'</span></div></div>';
    };
    var html='';
    if(nuevas.length) html+='<div class="ad-sec"><span>Sin revisar</span><b>'+nuevas.length+'</b><i></i></div>'+nuevas.map(tarjeta).join('');
    if(vistas.length) html+='<div class="ad-sec"><span>Ya revisadas</span><b>'+vistas.length+'</b><i></i></div>'+vistas.map(tarjeta).join('');

  async function stVerCv(ruta, btn){
    var txt = btn ? btn.innerHTML : '';
    if(btn){ btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Abriendo…'; }
    try{
      var url = await firebase.storage().ref(ruta).getDownloadURL();
      window.open(url, '_blank', 'noopener');
    }catch(e){
      console.error(e);
      toast(e.code==='storage/object-not-found' ? 'El archivo ya no está' : 'No se pudo abrir el CV');
    }finally{
      if(btn){ btn.disabled=false; btn.innerHTML=txt; }
    }

  async function stPostBorrar(id){
    var x=_stPost.find(function(p){return p.id===id;});
    if(!confirm('¿Eliminar la postulación de '+((x&&x.nombre)||'esta persona')+'?'+
      (x&&x.cvRuta ? '\n\nTambién se borra el CV adjunto.' : '')+'\n\nNo se puede deshacer.')) return;
    try{
      await db.collection('postulaciones').doc(id).delete();
      _stPost=_stPost.filter(function(p){return p.id!==id;});

  function renderSols(){
    var c=document.getElementById('stCuerpo'); if(!c) return;
    var nuevas=_stSol.filter(function(l){return (l.estado||'nuevo')==='nuevo';}).length;
    var chips=['nuevo','contactado','archivado','todos'].map(function(f){

      (nuevas? nuevas+(nuevas===1?' solicitud nueva sin contactar':' solicitudes nuevas sin contactar') : 'Todas las solicitudes fueron atendidas')+
      '</div><div class="st-chips">'+chips+'</div>'+lista;

  function stSolFiltro(f){ _stSolF=f; renderSols(); }

  function _stSolCard(l){

    r += '<div class="st-row"><span class="lbl">Teléfono</span><span>'+esc(l.telefono||'—')+'</span></div>';
    if(l.email) r += '<div class="st-row"><span class="lbl">Email</span><span><a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a></span></div>';
    if(l.tipo)  r += '<div class="st-row"><span class="lbl">Quiere</span><span>'+esc(_ST_TIPO[l.tipo]||l.tipo)+'</span></div>';
    if(l.zona)  r += '<div class="st-row"><span class="lbl">Zona</span><span>'+esc(l.zona)+'</span></div>';
    if(l.mensaje) r += '<div class="st-row"><span class="lbl">Mensaje</span><span>'+esc(l.mensaje)+'</span></div>';
    var f='';
    if(wa) f += '<a class="bd-btn" href="https://wa.me/'+wa+'" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> WhatsApp</a>';
    if(est!=='contactado') f += '<button class="bd-btn pri" onclick="stSolMarcar(\''+escA(l.id)+'\',\'contactado\')">Marcar contactada</button>';
    if(est!=='archivado') f += '<button class="bd-btn" onclick="stSolMarcar(\''+escA(l.id)+'\',\'archivado\')">Archivar</button>';
    else f += '<button class="bd-btn" onclick="stSolMarcar(\''+escA(l.id)+'\',\'nuevo\')">Reabrir</button>';
    var badge={nuevo:'warn',contactado:'ok',archivado:''}[est]||'';
    var lblE={nuevo:'Nueva',contactado:'Contactada',archivado:'Archivada'}[est]||est;
    return '<div class="st-card"><div class="st-h"><b>'+esc(l.nombre||'(sin nombre)')+'</b>'+
      '<span class="chip '+badge+'">'+lblE+'</span><span class="st-when">'+esc(_stFecha(l.createdAt))+'</span></div>'+
      '<div class="st-rows">'+r+'</div><div class="st-f"><span class="st-acts">'+f+'</span></div></div>';
  }
  async function stSolMarcar(id,estado){

      var l=_stSol.find(function(x){return x.id===id;}); if(l) l.estado=estado;
      renderSitio();
      toast(estado==='contactado'?'Marcada como contactada':estado==='archivado'?'Archivada':'Reabierta');

    try{
      var [n, p] = await Promise.all([
        db.collection('notifications').where('ownerId','==',yo.uid).where('read','==',false).get(),
        db.collection('users').where('status','==','pending').get()
      ]);
      var total = n.size + (p.size?1:0);
