</script>
<script>
  // ==========================================================================
  // DESEMPEÑO Y FICHA DE REUNIÓN INDIVIDUAL
  // --------------------------------------------------------------------------
  // Junta la actividad de cada agente en el CRM (contactos, seguimientos,
  // reuniones, visitas, tasaciones, propiedades y cierres), sugiere en qué
  // estado está (verde, amarillo o rojo) y arma la Ficha de Reunión Individual
  // ya llena: en la reunión se completa lo que no sale de los datos y se baja
  // el PDF. Nada se carga a mano: todo sale de lo que el equipo ya registra.
  //
  // De dónde sale cada número (por mes):
  //   Contactos     clientes nuevos a su nombre (los que entraron por un portal
  //                 también cuentan, y se avisan aparte en la observación).
  //   Seguimientos  notas en sus clientes + avances y notas en el historial de
  //                 las gestiones (el historial guarda el autor por nombre) +
  //                 "contacto registrado" en clientes sin gestiones.
  //   Reuniones / Visitas  eventos de la agenda que ya pasaron.
  //   Tasaciones    las aprobadas (las que esperan revisión se avisan aparte).
  //   Propiedades   las que cargó ese mes y ya están publicadas.
  //   Cierres       los del mapa de cierres y las gestiones que pasó a Cerrado,
  //                 sin contar dos veces la misma propiedad.
  // ==========================================================================
  var DZ_FILAS = [
    { clave:'contactos',    etiqueta:'Contactos' },
    { clave:'seguimientos', etiqueta:'Seguimientos' },
    { clave:'reuniones',    etiqueta:'Reuniones' },
    { clave:'visitas',      etiqueta:'Visitas' },
    { clave:'tasaciones',   etiqueta:'Tasaciones entregadas' },
    { clave:'propiedades',  etiqueta:'Propiedades publicadas' },
    { clave:'cierres',      etiqueta:'Cierres' }
  ];
  var DZ_MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var DZ_DIA = 86400000;
  var DZ_ESTADOS = {
    verde:    { txt:'Verde',    col:'#1f9d55' },
    amarillo: { txt:'Amarillo', col:'#b7791f' },
    rojo:     { txt:'Rojo',     col:'#c62828' }
  };
  // Días hasta la próxima revisión según cómo quedó (lo que dice la ficha en papel).
  var DZ_REVISION = { verde:20, amarillo:15, rojo:12 };
  var DZ_PLAN_AM = [
    { clave:'contactos',    etq:'Contactos nuevos' },
    { clave:'seguimientos', etq:'Seguimientos' },
    { clave:'reuniones',    etq:'Reuniones / visitas' },
    { clave:'crm',          etq:'Actualización de CRM' },
    { clave:'puntual',      etq:'Objetivo puntual a mejorar' }
  ];
  var DZ_PLAN_RO = [
    { clave:'contactos',    etq:'Contactos nuevos' },
    { clave:'seguimientos', etq:'Seguimientos' },
    { clave:'reuniones',    etq:'Reuniones / visitas' },
    { clave:'captacion',    etq:'Captación o avance comercial' },
    { clave:'crm',          etq:'CRM actualizado' }
  ];
  // Orígenes de cliente que no cargó el agente: llegaron solos desde un portal o la web.
  var DZ_LEADS = ['infocasas','ml','mercadolibre','web','lead','casasymas','cym','portal'];
  var DZ_TERMINALES = ['cerrado','perdido','externo','prop_eliminada'];

  var _dz = null;           // datos del CRM ya procesados (eventos por agente)
  var _dzPromesa = null;    // carga en curso
  var _dzPromesaDesde = 0;
  var _dzFichas = {};       // última ficha guardada de cada agente
  var _dzFichasError = false;
  var _dzPeriodo = '';      // mes de la segunda columna de la ficha ('AAAA-MM')
  var _dzOrden = 'prioridad';

  // ---- Fechas ----
  function dzPad(n){ return (n < 10 ? '0' : '') + n; }
  function dzClaveMes(d){ return d.getFullYear() + '-' + dzPad(d.getMonth() + 1); }
  function dzMesDe(clave){ var p = String(clave).split('-'); return new Date(+p[0], +p[1] - 1, 1); }
  function dzNombreMes(clave){ return DZ_MESES[dzMesDe(clave).getMonth()]; }
  function dzYMD(d){ return d.getFullYear() + '-' + dzPad(d.getMonth() + 1) + '-' + dzPad(d.getDate()); }
  function dzDMY(ymd){ var p = String(ymd || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
  function dzSumarDias(ymd, n){
    var p = String(ymd || '').split('-');
    var d = p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : new Date();
    d.setDate(d.getDate() + n);
    return dzYMD(d);
  }
  // Acepta lo que haya en la base: ISO, 'AAAA-MM-DD', Timestamp de Firestore o milisegundos.
  function dzFecha(v){
    if (!v) return null;
    if (typeof v === 'object'){
      if (typeof v.toDate === 'function'){ try { return v.toDate(); } catch(e){ return null; } }
      if (v.seconds != null) return new Date(v.seconds * 1000);
      if (v instanceof Date) return isNaN(v) ? null : v;
      return null;
    }
    if (typeof v === 'number') return new Date(v);
    var s = String(v);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    var d = new Date(s);
    return isNaN(d) ? null : d;
  }
  function dzNorm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/\s+/g, ' ').trim(); }

  // ---- Período ----
  // En los primeros días del mes el mes en curso casi no tiene datos: la ficha
  // arranca mostrando los dos meses completos anteriores.
  function dzPeriodoPorDefecto(){
    var h = new Date();
    return dzClaveMes(new Date(h.getFullYear(), h.getMonth() - (h.getDate() <= 7 ? 1 : 0), 1));
  }
  function dzMesesDe(clave){ var d = dzMesDe(clave); return [dzClaveMes(new Date(d.getFullYear(), d.getMonth() - 1, 1)), clave]; }
  function dzOpcionesPeriodo(sel){
    var h = new Date(), out = '', esta = false;
    var opcion = function(k){
      var m = dzMesesDe(k);
      return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + dzNombreMes(m[0]) + ' y ' +
        dzNombreMes(m[1]).toLowerCase() + ' ' + k.slice(0, 4) + '</option>';
    };
    for (var i = 0; i < 12; i++){
      var k = dzClaveMes(new Date(h.getFullYear(), h.getMonth() - i, 1));
      if (k === sel) esta = true;
      out += opcion(k);
    }
    // Una ficha vieja puede tener meses de hace más de un año: igual se muestran.
    if (sel && !esta && /^\d{4}-\d{2}$/.test(sel)) out = opcion(sel) + out;
    return out;
  }
  // Desde cuándo hay que leer notas para cubrir el período y los 60 días del estado.
  function dzDesdeParaPeriodo(clave){
    var m = dzMesesDe(clave || _dzPeriodo || dzPeriodoPorDefecto());
    return Math.min(+dzMesDe(m[0]), Date.now() - 65 * DZ_DIA);
  }

  // ---- Carga de datos ----
  function dzCargar(forzar, desde){
    desde = desde || dzDesdeParaPeriodo();
    if (_dz && !forzar && _dz.notasDesde <= desde && (Date.now() - _dz.cargadoAt) < 5 * 60 * 1000) return Promise.resolve(_dz);
    if (_dzPromesa && !forzar && _dzPromesaDesde <= desde) return _dzPromesa;
    var avisos = [];
    var leer = function(nombre, p){
      return p.catch(function(e){ console.warn('desempeño: ' + nombre, e); avisos.push(nombre); return { docs: [] }; });
    };
    var lista = function(s){ return s.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); }); };
    _dzPromesaDesde = desde;
    _dzPromesa = Promise.all([
      db.collection('users').get(),
      leer('clientes', db.collection('clients').get()),
      leer('gestiones', db.collection('gestiones').get()),
      leer('propiedades', db.collection('properties').get()),
      leer('agenda', db.collection('visits').get())
    ]).then(function(r){
      var clients = lista(r[1]);
      return dzCargarNotas(clients, desde).then(function(notas){
        if (notas.error) avisos.push('algunas notas de clientes');
        var dz = dzProcesar(lista(r[0]), clients, lista(r[2]), lista(r[3]), lista(r[4]), notas.porCliente);
        dz.avisos = avisos; dz.cargadoAt = Date.now(); dz.notasDesde = desde;
        _dz = dz; _dzPromesa = null;
        return dz;
      });
    }).catch(function(e){ _dzPromesa = null; throw e; });
    return _dzPromesa;
  }

  // Las notas viven dentro de cada cliente. Para no abrir cientos de clientes se
  // leen solo las de los que tuvieron movimiento en el período: al agregar una
  // nota el cliente queda marcado (lastNoteAt y updatedAt), así que no se pierde ninguna.
  function dzCargarNotas(clients, desde){
    var cand = clients.filter(function(c){
      var a = dzFecha(c.lastNoteAt), b = dzFecha(c.updatedAt);
      return Math.max(a ? +a : 0, b ? +b : 0) >= desde;
    });
    var porCliente = {}, error = false, i = 0;
    function lote(){
      if (i >= cand.length) return Promise.resolve();
      var parte = cand.slice(i, i + 20); i += 20;
      return Promise.all(parte.map(function(c){
        return db.collection('clients').doc(c.id).collection('notes').get().then(function(s){
          porCliente[c.id] = s.docs.map(function(d){ return d.data(); });
        }).catch(function(){ error = true; });
      })).then(lote);
    }
    return lote().then(function(){ return { porCliente: porCliente, error: error }; });
  }

  // Convierte todo lo leído en una lista de hechos por agente: { t: tipo, f: fecha, x: detalle }.
  function dzProcesar(users, clients, gestiones, props, visits, notas){
    var ahora = Date.now();
    var porUid = {}, porNombre = {}, repetidos = {};
    users.forEach(function(u){
      porUid[u.id] = u;
      var n = dzNorm(u.name);
      if (!n) return;
      if (porNombre[n] && porNombre[n] !== u.id) repetidos[n] = true; else porNombre[n] = u.id;
    });
    // Dos personas con el mismo nombre: el historial no permite saber cuál fue.
    Object.keys(repetidos).forEach(function(n){ delete porNombre[n]; });

    var ev = {};
    var poner = function(uid, t, f, x){
      if (!uid || !f || !porUid[uid]) return;
      (ev[uid] = ev[uid] || []).push({ t: t, f: f, x: x || {} });
    };
    var dueno = function(o){ return o.createdBy || o.agentId || o.ownerId || ''; };
    var gestPorCliente = {};
    gestiones.forEach(function(g){ if (g.clientId) (gestPorCliente[g.clientId] = gestPorCliente[g.clientId] || []).push(g); });

    // Contactos: clientes nuevos a su nombre.
    clients.forEach(function(c){
      var src = String(c.source || '').toLowerCase();
      poner(dueno(c), 'contactos', dzFecha(c.createdAt), { portal: DZ_LEADS.indexOf(src) >= 0 });
      // "Solo mantenerlo activo" en un cliente sin gestiones deja la marca en el cliente.
      if (c.ultimoContacto) poner(dueno(c), 'seguimientos', dzFecha(c.ultimoContacto));
    });
    // Seguimientos: notas...
    Object.keys(notas || {}).forEach(function(cid){
      (notas[cid] || []).forEach(function(n){ poner(n.authorId, 'seguimientos', dzFecha(n.createdAt)); });
    });
    // ...y avances o notas en el historial de las gestiones.
    var cierres = {};
    var gestCerradas = [];
    gestiones.forEach(function(g){
      var agG = g.agentId || g.createdBy || g.ownerId || '';
      (Array.isArray(g.historial) ? g.historial : []).forEach(function(h){
        if (!h || !h.tipo) return;
        var f = dzFecha(h.fecha);
        if (h.tipo === 'nota' || h.tipo === 'avance' || h.tipo === 'propiedad'){
          var autor = porNombre[dzNorm(h.autor)];
          if (autor) poner(autor, 'seguimientos', f);
        }
        if (h.tipo === 'avance' && dzNorm(h.valor) === 'cerrado' && agG && f) gestCerradas.push({ uid: agG, prop: g.propertyId || ('g:' + g.id), f: f });
      });
    });
    // Agenda: cuentan las que ya pasaron; las que vienen se avisan aparte.
    visits.forEach(function(v){
      var t = v.eventType === 'visit' ? 'visitas' : (v.eventType === 'meeting' ? 'reuniones' : null);
      if (!t) return;
      var f = dzFecha(v.date); if (!f) return;
      var hm = String(v.time || '').split(':');
      if (hm.length >= 2) f = new Date(f.getFullYear(), f.getMonth(), f.getDate(), +hm[0] || 0, +hm[1] || 0);
      poner(v.userId, +f > ahora ? t + 'Agendadas' : t, f);
    });
    // Tasaciones: las aprobadas cuentan como entregadas.
    users.forEach(function(u){
      ['tasaciones', 'calcTerrenos'].forEach(function(campo){
        var m = u[campo];
        if (!m || typeof m !== 'object') return;
        (Array.isArray(m) ? m : Object.keys(m).map(function(k){ return m[k]; })).forEach(function(r){
          if (!r || typeof r !== 'object' || r.rechazada) return;
          poner(u.id, r.revisado ? 'tasaciones' : 'tasacionesPendientes', dzFecha(r.fecha || r.creadoAt));
        });
      });
    });
    // Propiedades publicadas y cierres del mapa.
    props.forEach(function(p){
      var enTasacion = p.status === 'tasacion' || p.status === 'tasado';
      poner(p.ownerId, enTasacion ? 'propiedadesEnTasacion' : 'propiedades', dzFecha(p.createdAt));
      var c = p.cierre;
      if (c && typeof c === 'object'){
        var fc = dzFecha(c.fecha) || dzFecha(c.registradoEl);
        if (!fc) return;
        var quienes = [c.agenteUid || p.ownerId];
        (Array.isArray(c.participantes) ? c.participantes : []).forEach(function(x){ if (x && x.uid) quienes.push(x.uid); });
        quienes.forEach(function(uid){
          if (uid) cierres[uid + '|' + p.id] = { uid: uid, f: fc, registrado: true, confirmado: p.cierreConfirmado === true };
        });
      }
    });
    // Gestiones cerradas que no están en el mapa: la misma propiedad no se cuenta dos veces.
    gestCerradas.forEach(function(g){
      var k = g.uid + '|' + g.prop;
      if (!cierres[k]) cierres[k] = { uid: g.uid, f: g.f, registrado: false, confirmado: false };
      else if (!cierres[k].registrado && g.f > cierres[k].f) cierres[k].f = g.f;
    });
    Object.keys(cierres).forEach(function(k){
      var c = cierres[k];
      poner(c.uid, 'cierres', c.f, { registrado: c.registrado, confirmado: c.confirmado });
    });

    // Foto de la cartera de hoy.
    var cartera = {};
    var cuenta = function(uid){ return cartera[uid] = cartera[uid] || { activos: 0, dormidos: 0, propiedades: 0, tasPend: 0, cierresSinConf: 0 }; };
    clients.forEach(function(c){
      var uid = dueno(c);
      if (!uid || !porUid[uid] || c.archived) return;
      var gs = gestPorCliente[c.id] || [];
      var terminal = gs.length
        ? gs.every(function(g){ return DZ_TERMINALES.indexOf(g.estadoGestion) >= 0; })
        : ['cerrado', 'perdido'].indexOf(c.status) >= 0;
      if (terminal || c.situacion === 'pausa') return;
      var k = cuenta(uid);
      k.activos++;
      var ult = Math.max(+(dzFecha(c.updatedAt) || 0), +(dzFecha(c.lastNoteAt) || 0), +(dzFecha(c.ultimoContacto) || 0), +(dzFecha(c.createdAt) || 0));
      gs.forEach(function(g){ ult = Math.max(ult, +(dzFecha(g.updatedAt) || 0)); });
      if (ult && ahora - ult > 30 * DZ_DIA) k.dormidos++;
    });
    props.forEach(function(p){
      if (!p.ownerId || !porUid[p.ownerId]) return;
      if ((p.status === 'available' || p.status === 'reserved') && p.cierreConfirmado !== true) cuenta(p.ownerId).propiedades++;
    });
    Object.keys(ev).forEach(function(uid){
      ev[uid].forEach(function(e){ if (e.t === 'tasacionesPendientes') cuenta(uid).tasPend++; });
    });
    Object.keys(cierres).forEach(function(k){
      var c = cierres[k];
      if (c.registrado && !c.confirmado && porUid[c.uid]) cuenta(c.uid).cierresSinConf++;
    });
    return { porUid: porUid, ev: ev, cartera: cartera, ahora: ahora };
  }

  // ---- Métricas de un agente en dos meses ----
  function dzMetricas(uid, meses){
    var valores = {};
    DZ_FILAS.forEach(function(f){ valores[f.clave] = [0, 0]; });
    var extra = { portal: [0, 0], visitasAgendadas: 0, reunionesAgendadas: 0, tasPend: [0, 0], enTasacion: [0, 0], sinRegistrar: [0, 0], sinConfirmar: [0, 0] };
    ((_dz && _dz.ev[uid]) || []).forEach(function(e){
      var i = meses.indexOf(dzClaveMes(e.f));
      if (e.t === 'visitasAgendadas' || e.t === 'reunionesAgendadas'){ if (i === 1) extra[e.t]++; return; }
      if (i < 0) return;
      if (valores[e.t]) valores[e.t][i]++;
      if (e.t === 'contactos' && e.x.portal) extra.portal[i]++;
      if (e.t === 'tasacionesPendientes') extra.tasPend[i]++;
      if (e.t === 'propiedadesEnTasacion') extra.enTasacion[i]++;
      if (e.t === 'cierres' && !e.x.registrado) extra.sinRegistrar[i]++;
      if (e.t === 'cierres' && e.x.registrado && !e.x.confirmado) extra.sinConfirmar[i]++;
    });
    return { valores: valores, extra: extra };
  }
  // Fracción del mes que ya pasó (1 si el mes está cerrado).
  function dzFraccionMes(clave){
    var h = new Date();
    if (clave !== dzClaveMes(h)) return 1;
    return h.getDate() / new Date(h.getFullYear(), h.getMonth() + 1, 0).getDate();
  }
  // Compara al ritmo: el mes en curso se proyecta a mes entero.
  function dzTendencia(v, meses){
    var a = v[0], b = v[1];
    if (a + b < 3) return '';
    var frac = dzFraccionMes(meses[1]);
    if (frac < 0.25) return '';
    var proy = b / frac;
    if (a === 0) return proy > 0 ? 'en alza' : '';
    if (proy >= a * 1.15) return 'en alza';
    if (proy <= a * 0.85) return 'en baja';
    return 'estable';
  }
  function dzPlural(n, uno, varios){ return n + ' ' + (n === 1 ? uno : varios); }
  function dzObservacion(clave, v, extra, meses){
    var partes = [];
    var t = dzTendencia(v, meses);
    if (t) partes.push(t);
    var suma = function(x){ return x[0] + x[1]; };
    if (clave === 'contactos' && suma(extra.portal)) partes.push(suma(extra.portal) + ' de portales');
    if (clave === 'reuniones' && extra.reunionesAgendadas) partes.push('+' + dzPlural(extra.reunionesAgendadas, 'agendada', 'agendadas'));
    if (clave === 'visitas' && extra.visitasAgendadas) partes.push('+' + dzPlural(extra.visitasAgendadas, 'agendada', 'agendadas'));
    if (clave === 'tasaciones' && suma(extra.tasPend)) partes.push(suma(extra.tasPend) + ' sin aprobar');
    if (clave === 'propiedades' && suma(extra.enTasacion)) partes.push(suma(extra.enTasacion) + ' en tasación');
    if (clave === 'cierres' && suma(extra.sinConfirmar)) partes.push(suma(extra.sinConfirmar) + ' sin confirmar');
    if (clave === 'cierres' && suma(extra.sinRegistrar)) partes.push(suma(extra.sinRegistrar) + ' sin registrar en el mapa');
    return partes.join(' · ');
  }

  // ---- Estado sugerido: últimos 30 días contra los 30 anteriores ----
  var DZ_ACCIONES = { contactos: 1, seguimientos: 1, reuniones: 1, visitas: 1, tasaciones: 1, propiedades: 1, cierres: 1 };
  function dzSugerencia(uid, u){
    var ahora = _dz.ahora, a30 = 0, a60 = 0, vr30 = 0, ct30 = 0, ultima = 0;
    (_dz.ev[uid] || []).forEach(function(e){
      if (!DZ_ACCIONES[e.t]) return;
      var t = +e.f;
      if (t > ahora) return;
      if (t > ultima) ultima = t;
      var edad = ahora - t;
      if (edad <= 30 * DZ_DIA){
        a30++;
        if (e.t === 'visitas' || e.t === 'reuniones') vr30++;
        if (e.t === 'contactos') ct30++;
      } else if (edad <= 60 * DZ_DIA) a60++;
    });
    var dias = null;
    if (ultima){
      var h0 = new Date(ahora); h0.setHours(0, 0, 0, 0);
      var u0 = new Date(ultima); u0.setHours(0, 0, 0, 0);
      dias = Math.max(0, Math.round((h0 - u0) / DZ_DIA));
    }
    var r = { a30: a30, a60: a60, dias: dias };
    var alta = dzFecha(u && u.createdAt);
    var nuevo = alta && (ahora - alta) < 21 * DZ_DIA;
    if (!a30 && nuevo){
      r.estado = 'amarillo';
      r.motivo = 'Ingresó hace ' + Math.max(1, Math.floor((ahora - alta) / DZ_DIA)) + ' días y todavía no registra actividad.';
      return r;
    }
    if (dias === null){ r.estado = 'rojo'; r.motivo = 'No tiene actividad registrada en el CRM.'; return r; }
    if (!a30){ r.estado = 'rojo'; r.motivo = 'No registró actividad en los últimos 30 días (la última fue hace ' + dias + ' días).'; return r; }
    if (dias >= 14){ r.estado = 'rojo'; r.motivo = 'Hace ' + dias + ' días que no registra actividad.'; return r; }
    if (a60 >= 10 && a30 < a60 * 0.4){
      r.estado = 'rojo';
      r.motivo = 'Su actividad cayó fuerte: ' + a30 + ' acciones en los últimos 30 días contra ' + a60 + ' en los 30 anteriores.';
      return r;
    }
    var m = [];
    if (dias >= 7) m.push('hace ' + dias + ' días que no registra actividad');
    if (a60 > 0 && a30 < a60 * 0.8) m.push('bajó de ' + a60 + ' a ' + a30 + ' acciones en 30 días');
    if (!vr30) m.push('no tuvo visitas ni reuniones en 30 días');
    if (!ct30) m.push('no sumó contactos nuevos en 30 días');
    if (m.length){
      r.estado = 'amarillo';
      r.motivo = m.join('; ').replace(/^./, function(c){ return c.toUpperCase(); }) + '.';
      return r;
    }
    r.estado = 'verde';
    r.motivo = a60
      ? 'Sostiene su ritmo: ' + a30 + ' acciones en los últimos 30 días (' + a60 + ' en los 30 anteriores).'
      : 'Viene activo: ' + a30 + ' acciones en los últimos 30 días.';
    return r;
  }

  // ---- Textos que se arman solos ----
  function dzUnir(partes){ return partes.length > 1 ? partes.slice(0, -1).join(', ') + ' y ' + partes[partes.length - 1] : (partes[0] || ''); }
  function dzValoresDe(actividad){
    var v = {};
    DZ_FILAS.forEach(function(f){ v[f.clave] = [0, 0]; });
    (actividad || []).forEach(function(r){ if (v[r.clave]) v[r.clave] = [Number(r.valores[0]) || 0, Number(r.valores[1]) || 0]; });
    return v;
  }
  function dzTextoAvance(v, meses){
    var i = 1, nom = dzNombreMes(meses[1]).toLowerCase(), partes = [];
    if (v.contactos[i]) partes.push(dzPlural(v.contactos[i], 'contacto nuevo', 'contactos nuevos'));
    if (v.seguimientos[i]) partes.push(dzPlural(v.seguimientos[i], 'seguimiento', 'seguimientos'));
    if (v.visitas[i]) partes.push(dzPlural(v.visitas[i], 'visita', 'visitas'));
    if (v.reuniones[i]) partes.push(dzPlural(v.reuniones[i], 'reunión', 'reuniones'));
    if (v.tasaciones[i]) partes.push(dzPlural(v.tasaciones[i], 'tasación entregada', 'tasaciones entregadas'));
    if (v.propiedades[i]) partes.push(dzPlural(v.propiedades[i], 'propiedad publicada', 'propiedades publicadas'));
    if (v.cierres[i]) partes.push(dzPlural(v.cierres[i], 'cierre', 'cierres'));
    if (!partes.length) return 'En ' + nom + ' no registró actividad en el CRM.';
    return 'En ' + nom + ': ' + dzUnir(partes) + '.';
  }
  function dzTextoCartera(uid){
    var k = (_dz && _dz.cartera[uid]) || { activos: 0, dormidos: 0, propiedades: 0, tasPend: 0, cierresSinConf: 0 };
    var t = 'Cartera al ' + dzDMY(dzYMD(new Date())) + ': ' + dzPlural(k.activos, 'cliente activo', 'clientes activos');
    if (k.dormidos) t += ' (' + k.dormidos + ' sin movimiento hace más de 30 días)';
    t += ' · ' + dzPlural(k.propiedades, 'propiedad activa', 'propiedades activas');
    if (k.tasPend) t += ' · ' + dzPlural(k.tasPend, 'tasación sin aprobar', 'tasaciones sin aprobar');
    if (k.cierresSinConf) t += ' · ' + dzPlural(k.cierresSinConf, 'cierre sin confirmar', 'cierres sin confirmar');
    return t + '.';
  }
  // Objetivos: un 20% arriba de su mejor ritmo de los dos meses, con un piso
  // mínimo para quien viene parado. Los de 20 días son dos tercios del mes.
  function dzSugerirObjetivos(v, meses){
    var frac = Math.max(dzFraccionMes(meses[1]), 0.25);
    var base = function(k){ return Math.max(v[k][0], v[k][1] / frac); };
    var meta = function(b, minimo){ return Math.max(minimo, Math.ceil(b * 1.2)); };
    var mes = {
      c: meta(base('contactos'), 4), s: meta(base('seguimientos'), 8),
      v: meta(base('visitas') + base('reuniones'), 2), p: meta(base('propiedades'), 1),
      t: base('tasaciones') ? meta(base('tasaciones'), 1) : 0
    };
    var d20 = {
      c: Math.max(3, Math.ceil(mes.c * 2 / 3)), s: Math.max(5, Math.ceil(mes.s * 2 / 3)),
      v: Math.max(1, Math.ceil(mes.v * 2 / 3)), p: Math.max(1, Math.ceil(mes.p * 2 / 3)), t: mes.t ? Math.max(1, Math.ceil(mes.t * 2 / 3)) : 0
    };
    var txt = function(o){
      var p = [o.c + ' contactos nuevos', o.s + ' seguimientos', dzPlural(o.v, 'visita o reunión', 'visitas o reuniones'), dzPlural(o.p, 'captación', 'captaciones')];
      if (o.t) p.push(dzPlural(o.t, 'tasación', 'tasaciones'));
      return p.join(' · ');
    };
    return { d20: txt(d20), mes: txt(mes), num: mes };
  }

  // ==========================================================================
  // PESTAÑA DESEMPEÑO
  // ==========================================================================
  function dzCargarFichas(){
    return firebase.functions().httpsCallable('fichaReunion')({ accion: 'resumen' }).then(function(r){
      _dzFichas = (r.data && r.data.fichas) || {};
      _dzFichasError = false;
    }).catch(function(e){ console.warn('fichas de reunión:', e); _dzFichasError = true; });
  }
  function dzHerramientas(){
    if (!_dzPeriodo) _dzPeriodo = dzPeriodoPorDefecto();
    return '<select class="ad-sel" id="dzPeriodo" onchange="dzCambiarPeriodo(this.value)" title="Meses que se comparan">' + dzOpcionesPeriodo(_dzPeriodo) + '</select>' +
      '<select class="ad-sel" id="dzOrden" onchange="dzCambiarOrden(this.value)">' +
        '<option value="prioridad"' + (_dzOrden === 'prioridad' ? ' selected' : '') + '>Primero los que necesitan atención</option>' +
        '<option value="nombre"' + (_dzOrden === 'nombre' ? ' selected' : '') + '>Por nombre</option>' +
      '</select>' +
      '<button class="bd-btn dz-refrescar" onclick="dzActualizar()" title="Volver a leer los datos del CRM" aria-label="Actualizar"><i class="fas fa-rotate-right"></i></button>';
  }
  async function pintarDesempeno(c){
    if (!_dzPeriodo) _dzPeriodo = dzPeriodoPorDefecto();
    c.innerHTML = '<div class="cargando"><div class="sp"></div></div>';
    try{
      await Promise.all([dzCargar(false, dzDesdeParaPeriodo()), dzCargarFichas()]);
      if (seccion === 'desempeno') dzRender(c);
    }catch(e){
      console.error(e);
      c.innerHTML = '<div class="vacio"><i class="fas fa-triangle-exclamation"></i><h3>No se pudo cargar</h3><p>' + esc(e.message || e) + '</p></div>';
    }
  }
  function dzCambiarPeriodo(k){ _dzPeriodo = k; pintarDesempeno(document.getElementById('cuerpo')); }
  function dzCambiarOrden(k){ _dzOrden = k; if (_dz) dzRender(); }
  function dzActualizar(){ _dz = null; pintarDesempeno(document.getElementById('cuerpo')); }

  // Los asesores (grupo Comercial, o sin rango) que el que mira puede administrar.
  function dzAgentes(){
    return Object.keys(_dz.porUid).map(function(id){ return _dz.porUid[id]; }).filter(function(u){
      if (u.status !== 'approved' || !puedoAdministrar(u)) return false;
      var r = window.Rangos && Rangos.rango(u.rank);
      return !r || r.grupo === 'Comercial';
    });
  }
  function dzVencida(f){ return !!(f && f.proximaRevision && f.proximaRevision < dzYMD(new Date())); }
  function dzRender(c){
    c = c || document.getElementById('cuerpo');
    var meses = dzMesesDe(_dzPeriodo);
    var filas = dzAgentes().map(function(u){
      return { u: u, m: dzMetricas(u.id, meses), s: dzSugerencia(u.id, u), f: _dzFichas[u.id] || null };
    });
    var PRI = { rojo: 0, amarillo: 1, verde: 2 };
    filas.sort(function(a, b){
      if (_dzOrden === 'prioridad'){
        var d = (PRI[a.s.estado] - PRI[b.s.estado]) || ((dzVencida(b.f) ? 1 : 0) - (dzVencida(a.f) ? 1 : 0));
        if (d) return d;
      }
      return (a.u.name || '').localeCompare(b.u.name || '', 'es', { sensitivity: 'base' });
    });
    var cuenta = { verde: 0, amarillo: 0, rojo: 0 };
    filas.forEach(function(x){ cuenta[x.s.estado]++; });
    var venc = filas.filter(function(x){ return dzVencida(x.f); }).length;
    var h = '';
    if (_dz.avisos && _dz.avisos.length){
      h += '<div class="rev-alerta"><i class="fas fa-triangle-exclamation"></i> No se pudieron leer: ' + esc(_dz.avisos.join(', ')) +
        '. Esos números pueden quedar cortos.</div>';
    }
    h += '<div class="resumen">' +
      '<div class="rs"><b class="dz-c-verde">' + cuenta.verde + '</b><span>En verde</span></div>' +
      '<div class="rs"><b class="dz-c-amarillo">' + cuenta.amarillo + '</b><span>En amarillo</span></div>' +
      '<div class="rs"><b class="dz-c-rojo">' + cuenta.rojo + '</b><span>En rojo</span></div>' +
      '<div class="rs"><b' + (venc ? ' class="dz-c-rojo"' : '') + '>' + (_dzFichasError ? '—' : venc) + '</b><span>Revisiones vencidas</span></div>' +
    '</div>';
    h += '<p class="dz-nota">El estado lo sugiere el CRM con la actividad de los últimos 30 días; en la ficha lo confirmás o lo cambiás. ' +
      'Los números grandes son de <b>' + dzNombreMes(meses[1]).toLowerCase() + '</b> y los chicos, de ' + dzNombreMes(meses[0]).toLowerCase() + '.' +
      (_dzFichasError ? ' <b>No se pudo leer el historial de reuniones.</b>' : '') + '</p>';
    if (!filas.length){
      h += '<div class="vacio"><i class="fas fa-users"></i><h3>No hay asesores para mostrar</h3><p>Acá aparecen los asesores aprobados que podés administrar.</p></div>';
    } else {
      h += '<div class="card">' + filas.map(function(x){ return dzFilaHTML(x, meses); }).join('') + '</div>';
    }
    c.innerHTML = h;
  }
  function dzFilaHTML(x, meses){
    var u = x.u, v = x.m.valores, ab = dzNombreMes(meses[0]).slice(0, 3).toLowerCase();
    var met = function(etq, a, b){
      var e = etq.split('|');
      return '<div class="dz-m" title="' + escA(e[0]) + '"><b' + (b ? '' : ' class="cero"') + '>' + b + '</b>' +
        '<span><i class="l">' + e[0] + '</i><i class="c">' + (e[1] || e[0]) + '</i></span><em>' + ab + ' ' + a + '</em></div>';
    };
    var e = DZ_ESTADOS[x.s.estado];
    var ult = x.s.dias == null ? 'Sin actividad registrada'
      : 'Última actividad: ' + (x.s.dias === 0 ? 'hoy' : x.s.dias === 1 ? 'ayer' : 'hace ' + x.s.dias + ' días');
    var reu = '';
    if (x.f){
      var eF = DZ_ESTADOS[x.f.estado];
      reu = 'Última reunión: <b>' + dzDMY(x.f.fecha) + '</b>' + (eF ? ' · ' + eF.txt : '') +
        (x.f.proximaRevision ? '<br><span class="' + (dzVencida(x.f) ? 'venc' : '') + '">Revisión: ' + dzDMY(x.f.proximaRevision) +
          (dzVencida(x.f) ? ' (vencida)' : '') + '</span>' : '');
    } else if (!_dzFichasError) reu = '<span class="dz-sin">Sin fichas todavía</span>';
    return '<div class="dz-row">' + avatar(u) +
      '<div class="dz-id"><b>' + esc(u.name || u.email || 'Agente') + '</b><small>' + esc(ult) + '</small></div>' +
      '<div class="dz-est"><span class="dz-pill ' + x.s.estado + '"><i></i>' + e.txt + '</span><small title="' + escA(x.s.motivo) + '">' + esc(x.s.motivo) + '</small></div>' +
      '<div class="dz-mets">' +
        met('Contactos', v.contactos[0], v.contactos[1]) +
        met('Seguimientos|Seguim.', v.seguimientos[0], v.seguimientos[1]) +
        met('Visitas y reuniones|Vis.+reun.', v.visitas[0] + v.reuniones[0], v.visitas[1] + v.reuniones[1]) +
        met('Captaciones|Captac.', v.propiedades[0], v.propiedades[1]) +
        met('Cierres', v.cierres[0], v.cierres[1]) +
      '</div>' +
      '<div class="dz-reu">' + reu + '</div>' +
      '<button class="bd-btn pri dz-btn" onclick="abrirFicha(\'' + escA(u.id) + '\')"><i class="fas fa-clipboard-list"></i> Ficha</button>' +
    '</div>';
  }

  // ==========================================================================
  // EDITOR DE LA FICHA
  // ==========================================================================
  var _fr = null;   // { uid, ficha, anteriores, sucio, revManual, avanceAuto, msg }

  function frItem(plan, clave){
    plan.items = Array.isArray(plan.items) ? plan.items : [];
    for (var i = 0; i < plan.items.length; i++) if (plan.items[i] && plan.items[i].clave === clave) return plan.items[i];
    var it = { clave: clave, marcado: false, texto: '' };
    plan.items.push(it);
    return it;
  }
  function frActividad(uid, meses){
    var m = dzMetricas(uid, meses);
    return DZ_FILAS.map(function(fl){
      var v = m.valores[fl.clave];
      return { clave: fl.clave, etiqueta: fl.etiqueta, valores: [v[0], v[1]], obs: dzObservacion(fl.clave, v, m.extra, meses) };
    });
  }
  function frNueva(uid){
    var u = _dz.porUid[uid] || {};
    var meses = dzMesesDe(_dzPeriodo || dzPeriodoPorDefecto());
    var s = dzSugerencia(uid, u);
    var hoy = dzYMD(new Date());
    var act = frActividad(uid, meses);
    var f = {
      id: null, agenteUid: uid, agenteNombre: u.name || u.email || 'Agente',
      fecha: hoy, lider: (miPerfil && miPerfil.name) || (yo && yo.email) || '',
      estado: s.estado, estadoSugerido: s.estado, motivoSugerido: s.motivo,
      meses: meses.map(function(k){ return { clave: k, etiqueta: dzNombreMes(k) }; }),
      actividad: act,
      objetivo20: '', objetivoMes: '',
      diagnostico: { avance: dzTextoAvance(dzValoresDe(act), meses), falto: '', obstaculos: '', mejorar: '', apoyo: '' },
      compromisos: { semanal: '', mensual: '', acciones: '', proximaRevision: dzSumarDias(hoy, DZ_REVISION[s.estado] || 20) },
      planAmarillo: { items: [], revision: s.estado === 'amarillo' ? dzSumarDias(hoy, 15) : '' },
      planRojo: { items: [], revision: s.estado === 'rojo' ? dzSumarDias(hoy, 12) : '' },
      observaciones: '',
      cartera: dzTextoCartera(uid)
    };
    DZ_PLAN_AM.forEach(function(d){ frItem(f.planAmarillo, d.clave); });
    DZ_PLAN_RO.forEach(function(d){ frItem(f.planRojo, d.clave); });
    return f;
  }
  // Una ficha que viene del servidor o de un borrador puede no tener todo: se
  // completa con la estructura vacía para que el editor y el PDF nunca fallen.
  function frNormalizar(f, uid){
    f = JSON.parse(JSON.stringify(f || {}));
    var T = function(v){ return v == null ? '' : String(v); };
    f.agenteUid = uid;
    f.agenteNombre = T(f.agenteNombre) || ((_dz.porUid[uid] || {}).name) || 'Agente';
    f.fecha = /^\d{4}-\d{2}-\d{2}$/.test(T(f.fecha)) ? f.fecha : dzYMD(new Date());
    ['lider', 'estado', 'estadoSugerido', 'motivoSugerido', 'objetivo20', 'objetivoMes', 'observaciones', 'cartera'].forEach(function(k){ f[k] = T(f[k]); });
    if (!Array.isArray(f.meses) || f.meses.length !== 2){
      f.meses = dzMesesDe(_dzPeriodo || dzPeriodoPorDefecto()).map(function(k){ return { clave: k, etiqueta: dzNombreMes(k) }; });
    }
    var filas = {};
    (Array.isArray(f.actividad) ? f.actividad : []).forEach(function(r){ if (r && r.clave) filas[r.clave] = r; });
    f.actividad = DZ_FILAS.map(function(fl){
      var r = filas[fl.clave] || {};
      var vs = Array.isArray(r.valores) ? r.valores : [];
      return { clave: fl.clave, etiqueta: fl.etiqueta, valores: [Number(vs[0]) || 0, Number(vs[1]) || 0], obs: T(r.obs) };
    });
    f.diagnostico = f.diagnostico || {};
    ['avance', 'falto', 'obstaculos', 'mejorar', 'apoyo'].forEach(function(k){ f.diagnostico[k] = T(f.diagnostico[k]); });
    f.compromisos = f.compromisos || {};
    ['semanal', 'mensual', 'acciones', 'proximaRevision'].forEach(function(k){ f.compromisos[k] = T(f.compromisos[k]); });
    ['planAmarillo', 'planRojo'].forEach(function(k){
      var p = f[k] = (f[k] && typeof f[k] === 'object') ? f[k] : {};
      p.revision = T(p.revision);
      (k === 'planAmarillo' ? DZ_PLAN_AM : DZ_PLAN_RO).forEach(function(d){ var it = frItem(p, d.clave); it.texto = T(it.texto); it.marcado = it.marcado === true; });
    });
    return f;
  }

  // ---- Borrador en este dispositivo: si se cierra sin guardar, no se pierde lo escrito ----
  function frClaveBorrador(uid){ return 'malaveFichaBorrador:' + uid; }
  function frGuardarBorrador(){
    if (!_fr) return;
    try { localStorage.setItem(frClaveBorrador(_fr.uid), JSON.stringify({ at: Date.now(), ficha: _fr.ficha })); } catch(e){}
  }
  function frLeerBorrador(uid){
    try {
      var d = JSON.parse(localStorage.getItem(frClaveBorrador(uid)) || 'null');
      if (d && d.ficha && typeof d.ficha === 'object' && Date.now() - d.at < 14 * DZ_DIA) return d;
    } catch(e){}
    return null;
  }
  function frBorrarBorrador(uid){ try { localStorage.removeItem(frClaveBorrador(uid)); } catch(e){} }
  var _frTimer = null;
  function frMarcarSucio(){
    if (!_fr) return;
    _fr.sucio = true;
    _fr.cambios = (_fr.cambios || 0) + 1;
    frMsg('Sin guardar', false);
    clearTimeout(_frTimer);
    _frTimer = setTimeout(frGuardarBorrador, 500);
  }
  function frMsg(t, ok){
    if (_fr) _fr.msg = t;
    var e = document.getElementById('frMsg');
    if (e){ e.textContent = t || ''; e.className = 'fr-msg' + (ok ? ' ok' : ''); }
  }

  // ---- Abrir / cerrar ----
  function frOverlay(){
    var ov = document.getElementById('frOv');
    if (ov) return ov;
    ov = document.createElement('div');
    ov.id = 'frOv';
    ov.className = 'fr-ov';
    ov.innerHTML = '<div class="fr-box" id="frBox"></div>';
    document.body.appendChild(ov);
    ov.addEventListener('input', frOnInput);
    ov.addEventListener('change', frOnChange);
    ov.addEventListener('click', frOnClick);
    document.addEventListener('keydown', frTecla);
    document.body.style.overflow = 'hidden';
    return ov;
  }
  function frTecla(e){ if (e.key === 'Escape' && document.getElementById('frOv')) frCerrar(); }
  async function abrirFicha(uid){
    cerrarMenu();
    var ov = frOverlay();
    document.getElementById('frBox').innerHTML =
      '<div class="fr-top"><div class="fr-tit"><small>Ficha de reunión individual</small><b>Cargando…</b></div>' +
      '<button class="kb" data-accion="cerrar" title="Cerrar"><i class="fas fa-xmark"></i></button></div>' +
      '<div class="fr-cargando"><div class="sp"></div>Juntando la actividad del CRM…</div>';
    try {
      if (!_dzPeriodo) _dzPeriodo = dzPeriodoPorDefecto();
      await dzCargar(false, dzDesdeParaPeriodo());
    } catch(e){
      console.error(e); frCerrar(); toast('No se pudieron leer los datos del CRM'); return;
    }
    if (!document.getElementById('frOv')) return;   // se cerró mientras cargaba
    var u = _dz.porUid[uid];
    if (!u || !puedoAdministrar(u)){ frCerrar(); toast('No podés hacer la ficha de esta persona'); return; }
    var ficha = frNueva(uid), usarBorrador = false;
    var borrador = frLeerBorrador(uid);
    if (borrador){
      usarBorrador = confirm('Tenés una ficha de ' + (u.name || 'este agente') + ' sin guardar, del ' + dzDMY(borrador.ficha.fecha) +
        '.\n\nAceptar: seguir con esa.\nCancelar: empezar una nueva con los datos de hoy.');
      if (usarBorrador){
        var id0 = borrador.ficha.id || null;
        ficha = frNormalizar(borrador.ficha, uid);
        ficha.id = id0;
      } else frBorrarBorrador(uid);
    }
    _fr = { uid: uid, ficha: ficha, anteriores: null, sucio: usarBorrador, cambios: 0,
            revManual: usarBorrador || !!ficha.id, avanceAuto: ficha.diagnostico.avance, msg: usarBorrador ? 'Borrador sin guardar' : '' };
    frPintar();
    frCargarAnteriores(uid);
  }
  function frCerrar(){
    var ov = document.getElementById('frOv');
    if (ov) ov.remove();
    document.removeEventListener('keydown', frTecla);
    document.body.style.overflow = '';
    if (_fr && _fr.sucio){ frGuardarBorrador(); toast('Quedó un borrador en este dispositivo'); }
    _fr = null;
    if (seccion === 'desempeno' && _dz) dzRender();
  }

  // ---- Dibujo del editor ----
  function frCampo(etq, control){ return '<label class="fr-f"><span>' + esc(etq) + '</span>' + control + '</label>'; }
  function frTa(k, filas, ph){
    var v = k.split('.').reduce(function(o, p){ return o == null ? '' : o[p]; }, _fr.ficha);
    return '<textarea data-k="' + k + '" rows="' + (filas || 2) + '"' + (ph ? ' placeholder="' + escA(ph) + '"' : '') + '>' + esc(v || '') + '</textarea>';
  }
  function frIn(k, ph, tipo){
    var v = k.split('.').reduce(function(o, p){ return o == null ? '' : o[p]; }, _fr.ficha);
    return '<input ' + (tipo ? 'type="' + tipo + '" ' : '') + 'data-k="' + k + '" value="' + escA(v || '') + '"' + (ph ? ' placeholder="' + escA(ph) + '"' : '') + '>';
  }
  function frPrevia(){
    var a = _fr && _fr.anteriores, f = _fr && _fr.ficha;
    if (!Array.isArray(a)) return null;
    var otras = a.filter(function(x){ return x.id !== f.id && String(x.fecha || '') <= String(f.fecha || ''); });
    return otras[0] || null;
  }
  function frHTMLAnteriores(){
    var a = _fr.anteriores, f = _fr.ficha;
    if (a === null) return '<div class="fr-ant" id="frAnt"><i class="fas fa-spinner fa-spin"></i> Buscando reuniones anteriores…</div>';
    if (a === false) return '<div class="fr-ant" id="frAnt"><i class="fas fa-circle-info"></i> No se pudo leer el historial de reuniones. La ficha se completa y se descarga igual.</div>';
    var otras = a.filter(function(x){ return x.id !== f.id; });
    var sel = '<select id="frHist" title="Abrir otra ficha">' +
      '<option value="">' + (f.id ? 'Esta ficha (' + dzDMY(f.fecha) + ')' : 'Ficha nueva (' + dzDMY(f.fecha) + ')') + '</option>' +
      (f.id ? '<option value="__nueva">Empezar una ficha nueva</option>' : '') +
      otras.map(function(x){
        var e = DZ_ESTADOS[x.estado];
        return '<option value="' + escA(x.id) + '">' + dzDMY(x.fecha) + ' · ' + (e ? e.txt : 'sin estado') + '</option>';
      }).join('') + '</select>';
    if (!otras.length){
      return '<div class="fr-ant" id="frAnt"><div class="fr-ant-h"><b><i class="fas fa-seedling"></i> ' +
        (f.id ? 'Es la única ficha de ' : 'Primera ficha de ') + esc(f.agenteNombre) + '</b>' + (f.id ? sel : '') + '</div></div>';
    }
    var h = '<div class="fr-ant" id="frAnt"><div class="fr-ant-h"><b><i class="fas fa-clock-rotate-left"></i> Reuniones anteriores (' + otras.length + ')</b>' + sel + '</div>';
    var p = frPrevia();
    if (p){
      var e = DZ_ESTADOS[p.estado], c = p.compromisos || {};
      var fila = function(etq, v){ return v ? '<div><span>' + esc(etq) + ':</span> ' + esc(v) + '</div>' : ''; };
      h += '<div class="fr-ant-c">Lo acordado el <b>' + dzDMY(p.fecha) + '</b>' + (e ? ' (quedó en ' + e.txt.toLowerCase() + ')' : '') +
        fila('Objetivo de 20 días', p.objetivo20) + fila('Objetivo mensual', p.objetivoMes) +
        fila('Objetivo semanal', c.semanal) + fila('Acciones', c.acciones) +
        fila('Revisión prevista', dzDMY(c.proximaRevision)) + '</div>';
    }
    return h + '</div>';
  }
  function frHTMLPlan(campo, n){
    var am = campo === 'planAmarillo', f = _fr.ficha, p = f[campo];
    var activo = f.estado === (am ? 'amarillo' : 'rojo');
    var h = '<section class="fr-sec ' + (am ? 'am' : 'ro') + (activo ? '' : ' off') + '"><h4><span class="fr-num">' + n + '</span><span class="fr-h4t">' +
      (am ? 'Si queda en amarillo: plan de seguimiento' : 'Si queda en rojo: plan de 12 días') + '</span>' +
      (activo ? '<button type="button" class="fr-link fr-der" data-accion="sugerir-plan">Sugerir plan</button>' : '') + '</h4>';
    if (!activo) return h + '<p class="fr-off">Se completa si el estado queda en ' + (am ? 'amarillo' : 'rojo') + '.</p></section>';
    (am ? DZ_PLAN_AM : DZ_PLAN_RO).forEach(function(d){
      var it = frItem(p, d.clave), id = 'fr' + campo + d.clave;
      h += '<div class="fr-plan-i"><input type="checkbox" id="' + id + '" data-plan="' + campo + '" data-clave="' + d.clave + '"' + (it.marcado ? ' checked' : '') + '>' +
        '<label for="' + id + '">' + esc(d.etq) + '</label>' +
        '<input type="text" data-plan="' + campo + '" data-clave="' + d.clave + '" value="' + escA(it.texto) + '"></div>';
    });
    h += '<div class="fr-plan-i"><span class="fr-plan-cal"><i class="fas fa-calendar-day"></i></span>' +
      '<label for="fr' + campo + 'Rev">Fecha de revisión' + (am ? ' (15 días)' : '') + '</label>' +
      '<input type="date" id="fr' + campo + 'Rev" data-k="' + campo + '.revision" value="' + escA(p.revision) + '"></div>';
    return h + '</section>';
  }
  function frHTML(){

    var h = '<div class="fr-top"><div class="fr-tit"><small>Ficha de reunión individual</small><b>' + esc(f.agenteNombre) + '</b></div>' +

      '<div class="fr-2">' + frCampo('Fecha', frIn('fecha', '', 'date')) + frCampo('Líder / Responsable', frIn('lider')) + '</div>' +
      '<div class="fr-f"><span>Estado</span><div class="fr-est">' + ['verde', 'amarillo', 'rojo'].map(function(k){

      }).join('') + '</div>' +
      (sug ? '<div class="fr-sug">Sugerido por el CRM: <b style="color:' + sug.col + '">' + sug.txt + '</b>. ' + esc(f.motivoSugerido) +

        '<input type="number" min="0" inputmode="numeric" data-act="' + i + '" data-col="1" value="' + r.valores[1] + '" aria-label="' + escA(r.etiqueta + ' ' + f.meses[1].etiqueta) + '">' +
        '<span class="tot" id="frTot' + i + '">' + (r.valores[0] + r.valores[1]) + '</span>' +
        '<span class="obs"><input data-act="' + i + '" data-col="obs" value="' + escA(r.obs) + '" placeholder="Observación"></span></div>';

      '<button class="bd-btn pri" data-accion="pdf" id="frBtnPdf"><i class="fas fa-file-pdf"></i> Descargar PDF</button></div>';

  // Se vuelve a dibujar todo sin perder la posición del scroll.
  function frPintar(mantenerScroll){
    var box = document.getElementById('frBox');
    if (!box || !_fr) return;
    var cu = document.getElementById('frCuerpo');
    var y = (mantenerScroll && cu) ? cu.scrollTop : 0;
    box.innerHTML = frHTML();

  function frPintarAnteriores(){
    var c = document.getElementById('frAnt');
    if (c) c.outerHTML = frHTMLAnteriores();
    // El "¿Qué faltó cumplir?" muestra lo que se había acordado.
    var p = frPrevia(), ta = document.querySelector('#frOv textarea[data-k="diagnostico.falto"]');
    if (ta && p && (p.objetivo20 || p.objetivoMes)) ta.placeholder = 'Lo acordado: ' + (p.objetivo20 || p.objetivoMes);
  }

  // ---- Eventos ----
  function frSet(path, val){
    var p = path.split('.'), o = _fr.ficha;
    for (var i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p[p.length - 1]] = val;
  }
  function frOnInput(e){
    var t = e.target;
    if (!t || !_fr || t.type === 'checkbox' || t.id === 'frHist' || t.id === 'frMeses') return;
    if (t.dataset.k){

  // ==========================================================================
  // PDF DE LA FICHA — dibujado con jsPDF (texto y formas, sin fotos).
  // Replica la ficha en papel: mismas secciones, mismo orden y colores. Se
  // dibuja con las medidas del original (1055 × 1491) pasadas a A4.
  // OJO: las fuentes estándar del PDF solo tienen los caracteres de WinAnsi;

  // ==========================================================================
  function cargarJsPDF(){
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
    if (window._cargaJsPDF) return window._cargaJsPDF;
    window._cargaJsPDF = new Promise(function(ok, mal){
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = function(){ if (window.jspdf && window.jspdf.jsPDF) ok(window.jspdf.jsPDF); else { window._cargaJsPDF = null; mal(new Error('el generador de PDF no cargó')); } };
      s.onerror = function(){ window._cargaJsPDF = null; mal(new Error('no se pudo cargar el generador de PDF (revisá la conexión)')); };
      document.head.appendChild(s);
    });
    return window._cargaJsPDF;
  }
  var PDF_EXTRA_OK = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
  var PDF_ESPACIOS = new RegExp('[' + String.fromCharCode(0xa0, 0x202f, 0x2007, 0x2009, 0x200a) + ']', 'g');
  var PDF_GUIONES = new RegExp('[' + String.fromCharCode(0x2010, 0x2011, 0x2012, 0x2212) + ']', 'g');
  var PDF_INVISIBLES = new RegExp('[' + String.fromCharCode(0x200b, 0x200c, 0x200d, 0xfeff) + ']', 'g');
  function pdfTxt(s){
    s = String(s == null ? '' : s).replace(/\r\n?/g, '\n').replace(PDF_ESPACIOS, ' ').replace(PDF_GUIONES, '-').replace(PDF_INVISIBLES, '');
    var out = '';
    for (var i = 0; i < s.length; i++){
      var ch = s[i], c = s.charCodeAt(i);
      if (c === 10 || (c >= 32 && c < 127) || (c >= 160 && c <= 255) || PDF_EXTRA_OK.indexOf(ch) >= 0){ out += ch; continue; }
      var base = ch.normalize ? ch.normalize('NFD').replace(/\p{M}/gu, '') : '';
      if (base && base.charCodeAt(0) >= 32 && base.charCodeAt(0) < 256) out += base;
    }
    return out;
  }
  function fichaPDF(JsPDF, f){
    var pdf = new JsPDF({ unit: 'pt', format: 'a4', orientation: 'portrait', compress: true });

      rojo: [198, 40, 40], tinta: [24, 56, 110], gris: [110, 118, 130], fondo: [246, 247, 249], blanco: [255, 255, 255]

    var trazo = function(c, w){ pdf.setDrawColor(c[0], c[1], c[2]); pdf.setLineWidth(w); };

    };

    var etiquetaConLinea = function(etq, x, y, x2){

      txt(titulo, X(x + 42), X(y + 22));
    };
    var caja = function(x, y, w, h, c, lw, r){
      trazo(c || C.navy, lw || 1.1);
      pdf.roundedRect(X(x), X(y), X(w), X(h), X(r || 14), X(r || 14), 'S');
    };
    var casilla = function(x, y, marcada, c){
      trazo(c, 0.9);
      pdf.rect(X(x), X(y), X(13), X(13), 'S');
      if (marcada){
        trazo(c, 1.5);
        pdf.line(X(x + 2.6), X(y + 7), X(x + 5.6), X(y + 10.4));
        pdf.line(X(x + 5.6), X(y + 10.4), X(x + 11), X(y + 2.8));
      }
    };
    var flechaEnCirculo = function(cx, cy, r, c){
      // Punta de flecha sobre el círculo, arriba a la derecha, girando en sentido horario.
      var a = -Math.PI / 4, px = cx + r * Math.cos(a), py = cy + r * Math.sin(a);
      var tx = -Math.sin(a), ty = Math.cos(a);   // tangente (horario)
      var nx = Math.cos(a), ny = Math.sin(a);    // normal
      relleno(c);
      pdf.triangle(X(px + tx * 9), X(py + ty * 9), X(px - tx * 3 + nx * 7), X(py - ty * 3 + ny * 7), X(px - tx * 3 - nx * 7), X(py - ty * 3 - ny * 7), 'F');
    };

    // ---------- Encabezado ----------
    rombo(PIE, 16, 7, C.oro);
    fuente('times', 'normal', 17, C.navy);
    var wMarca = ancho('Malave Inmobiliaria') / S;
    txt('Malave Inmobiliaria', X(PIE), X(55), 'center');
    trazo(C.oro, 0.8);
    linea(PIE - wMarca / 2 - 170, 40, PIE - wMarca / 2 - 22, 40);
    linea(PIE + wMarca / 2 + 22, 40, PIE + wMarca / 2 + 170, 40);
    var titulo = 'Ficha de Reunión Individual';
    fuente('times', 'bold', 10, C.navy);
    var tamT = Math.min(38, 10 * X(820) / ancho(titulo));
    fuente('times', 'bold', tamT, C.navy);
    txt(titulo, X(PIE), X(127), 'center');
    trazo(C.oro, 0.8);
    linea(250, 148, PIE - 18, 148);
    linea(PIE + 18, 148, 805, 148);
    rombo(PIE, 148, 6, C.oro);
    fuente('times', 'italic', 13.5, C.navy);
    txt('Seguimiento de desempeño y plan de acción', X(PIE), X(179), 'center');

    // ---------- 1. Datos del asesor ----------
    caja(42, 227, 438, 188);
    pastilla(1, 'Datos del asesor', 42, 194);
    var x0 = etiquetaConLinea('Nombre del asesor:', 58, 265, 461);
    enRenglones(f.agenteNombre, [{ x1: x0, x2: 461, l: 267 }], 9.6);
    x0 = etiquetaConLinea('Fecha:', 58, 306, 461);
    enRenglones(dzDMY(f.fecha), [{ x1: x0, x2: 461, l: 308 }], 9.6);
    x0 = etiquetaConLinea('Líder / Responsable:', 58, 348, 461);
    enRenglones(f.lider, [{ x1: x0, x2: 461, l: 350 }], 9.6);
    fuente('times', 'normal', 9.6, C.navy);
    txt('Estado:', X(58), X(390));
    [['verde', 'Verde', 157, C.verde], ['amarillo', 'Amarillo', 273, C.ambar], ['rojo', 'Rojo', 406, C.rojo]].forEach(function(e){
      var c = e[3], cx = e[2], cy = 385;
      trazo(c, 1.2);
      if (f.estado === e[0]){
        relleno(c);
        pdf.circle(X(cx), X(cy), X(10.5), 'FD');
        trazo(C.blanco, 1.4);
        pdf.line(X(cx - 5), X(cy + 0.5), X(cx - 1.5), X(cy + 4));
        pdf.line(X(cx - 1.5), X(cy + 4), X(cx + 5.5), X(cy - 4));
      } else pdf.circle(X(cx), X(cy), X(10.5), 'S');
      fuente('times', f.estado === e[0] ? 'bold' : 'normal', 9.6, C.navy);
      txt(e[1], X(cx + 20), X(cy + 5));
    });

    // ---------- 2. Objetivos acordados ----------
    caja(498, 227, 515, 190);
    pastilla(2, 'Objetivos acordados', 498, 194);
    [[506, 247, 'Objetivo de 20 días', f.objetivo20], [762, 242, 'Objetivo mensual', f.objetivoMes]].forEach(function(o){
      caja(o[0], 236, o[1], 174, C.oro, 0.9, 10);
      fuente('times', 'bold', 10.6, C.oroTxt);
      txt(o[2], X(o[0] + o[1] / 2), X(265), 'center');
      trazo(C.oro, 0.6);
      linea(o[0] + 12, 276, o[0] + o[1] - 12, 276);
      enCaja(o[3], o[0] + 14, 284, o[0] + o[1] - 14, 402, 9, 6.6);
    });

    // ---------- 3. Actividad registrada ----------
    pastilla(3, 'Actividad registrada', 42, 430);
    var T0 = 463, TH = 32, TR = 29, TX = [42, 363, 538, 715, 1011];
    var filas = f.actividad || [];
    var yFin = T0 + TH + TR * filas.length, yPie = yFin + 23;
    relleno(C.fondo);
    pdf.rect(X(42), X(yFin), X(969), X(yPie - yFin), 'F');
    relleno(C.navy);
    pdf.roundedRect(X(42), X(T0), X(969), X(TH), X(9), X(9), 'F');
    pdf.rect(X(42), X(T0 + TH / 2), X(969), X(TH / 2), 'F');
    trazo(C.navy, 1.1);
    pdf.roundedRect(X(42), X(T0), X(969), X(yPie - T0), X(9), X(9), 'S');
    fuente('times', 'bold', 10, C.blanco);
    var cabeza = ['Indicador', (f.meses[0] || {}).etiqueta || '', (f.meses[1] || {}).etiqueta || '', 'Total / Observación'];
    cabeza.forEach(function(t, i){ txt(t, X((TX[i] + TX[i + 1]) / 2), X(T0 + 21), 'center'); });
    trazo(C.blanco, 0.5);
    [1, 2, 3].forEach(function(i){ linea(TX[i], T0 + 5, TX[i], T0 + TH - 5); });
    trazo(C.navy, 0.45);
    [1, 2, 3].forEach(function(i){ linea(TX[i], T0 + TH, TX[i], yFin); });
    filas.forEach(function(r, i){
      var y = T0 + TH + TR * i;
      if (i) { trazo(C.navy, 0.45); linea(42, y, 1011, y); }
      fuente('times', 'normal', 9.6, C.navy);
      txt(r.etiqueta, X(58), X(y + 19.5));
      var a = Number(r.valores[0]) || 0, b = Number(r.valores[1]) || 0;
      fuente('helvetica', 'bold', 9.6, C.tinta);
      txt(String(a), X((TX[1] + TX[2]) / 2), X(y + 19.5), 'center');
      txt(String(b), X((TX[2] + TX[3]) / 2), X(y + 19.5), 'center');
      var wT = txt(String(a + b), X(TX[3] + 14), X(y + 19.5));
      var obs = pdfTxt(r.obs || '').replace(/\s+/g, ' ').trim();
      if (obs){
        // En una línea si entra; si no, en dos renglones más chicos.
        var xo = X(TX[3] + 14) + wT + X(10), disp = X(TX[4] - 10) - xo, tam = 8.2;
        fuente('helvetica', 'normal', tam, C.tinta);
        while (ancho(obs) > disp && tam > 7.2){ tam -= 0.2; pdf.setFontSize(tam); }
        if (ancho(obs) <= disp) pdf.text(obs, xo, X(y + 19.2));
        else {
          fuente('helvetica', 'normal', 6.6, C.tinta);
          var dos = partir(obs, disp);
          if (dos.length > 2){ dos = dos.slice(0, 2); dos[1] = recortar(dos[1] + '…', disp); }
          dos.forEach(function(l, k){ pdf.text(l, xo, X(y + 12 + k * 10.6)); });
        }
      }
    });
    trazo(C.navy, 0.45);
    linea(42, yFin, 1011, yFin);
    fuente('helvetica', 'italic', 7.6, C.gris);
    pdf.text(recortar(pdfTxt(f.cartera || '').replace(/\s+/g, ' '), X(940)), X(58), X(yFin + 15.5));

    // ---------- 4. Diagnóstico ----------
    var D = f.diagnostico || {};
    caja(42, 761, 473, 243);
    pastilla(4, 'Diagnóstico de la reunión', 42, 728);
    x0 = etiquetaConLinea('¿Qué avance tuvo?', 57, 793, 500);
    trazo(C.navy, 0.45); linea(57, 820, 500, 820);
    enRenglones(D.avance, [{ x1: x0, x2: 500, l: 795 }, { x1: 60, x2: 500, l: 820 }], 8.8);
    x0 = etiquetaConLinea('¿Qué faltó cumplir?', 57, 847, 500);
    trazo(C.navy, 0.45); linea(57, 872, 500, 872);
    enRenglones(D.falto, [{ x1: x0, x2: 500, l: 849 }, { x1: 60, x2: 500, l: 872 }], 8.8);
    x0 = etiquetaConLinea('¿Qué obstáculos tuvo?', 57, 898, 500);
    trazo(C.navy, 0.45); linea(57, 923, 500, 923);
    enRenglones(D.obstaculos, [{ x1: x0, x2: 500, l: 900 }, { x1: 60, x2: 500, l: 923 }], 8.8);
    x0 = etiquetaConLinea('¿Qué necesita mejorar?', 57, 949, 500);
    enRenglones(D.mejorar, [{ x1: x0, x2: 500, l: 951 }], 8.8);
    x0 = etiquetaConLinea('¿Qué apoyo necesita del líder?', 57, 983, 500);
    enRenglones(D.apoyo, [{ x1: x0, x2: 500, l: 985 }], 8.8);

    // ---------- 5. Compromisos próximos ----------
    var K = f.compromisos || {};
    caja(530, 761, 483, 243);
    pastilla(5, 'Compromisos próximos', 530, 728);
    x0 = etiquetaConLinea('Próximo objetivo semanal:', 548, 793, 996);
    enRenglones(K.semanal, [{ x1: x0, x2: 996, l: 795 }], 8.8);
    x0 = etiquetaConLinea('Próximo objetivo mensual:', 548, 834, 996);
    enRenglones(K.mensual, [{ x1: x0, x2: 996, l: 836 }], 8.8);
    x0 = etiquetaConLinea('Acciones concretas:', 548, 875, 996);
    trazo(C.navy, 0.45);
    [900, 924, 948].forEach(function(y){ linea(548, y + 2, 996, y + 2); });
    enRenglones(K.acciones, [{ x1: x0, x2: 996, l: 877 }, { x1: 551, x2: 996, l: 902 }, { x1: 551, x2: 996, l: 926 }, { x1: 551, x2: 996, l: 950 }], 8.8);
    x0 = etiquetaConLinea('Fecha de próxima revisión:', 548, 987, 996);
    enRenglones(dzDMY(K.proximaRevision), [{ x1: x0, x2: 996, l: 989 }], 9.4);

    // ---------- 6 y 7. Planes ----------
    var plan = function(campo, defs, x, w, c, n, t1, t2, ultimo, icono){
      var activo = f.estado === (campo === 'planAmarillo' ? 'amarillo' : 'rojo');
      var p = f[campo] || { items: [] };
      caja(x, 1019, w, 222, c, 1.2, 10);
      relleno(c);
      pdf.circle(X(x + 33), X(1045), X(14), 'F');
      fuente('times', 'bold', 11, C.blanco);
      txt(String(n), X(x + 33), X(1049.5), 'center');
      fuente('times', 'bold', 11.6, c);
      var w1 = txt(t1, X(x + 58), X(1051.5));
      fuente('times', 'normal', 11.6, c);
      txt(' ' + t2, X(x + 58) + w1, X(1051.5));
      icono(x + 53, 1134, c);
      var filasPlan = defs.map(function(d){
        var it = (p.items || []).filter(function(i){ return i && i.clave === d.clave; })[0] || {};
        return { etq: d.etq, marcado: activo && it.marcado === true, texto: activo ? (it.texto || '') : '' };
      });
      filasPlan.push({ etq: ultimo, marcado: activo && !!p.revision, texto: activo ? dzDMY(p.revision) : '' });
      filasPlan.forEach(function(r, i){
        var yb = 1084 + 29 * i;
        casilla(x + 112, yb - 11, r.marcado, c);
        fuente('times', 'normal', 9.4, C.navy);
        var wl = txt(r.etq, X(x + 142), X(yb)) / S;
        var xl = x + 142 + wl + 8;
        trazo(C.navy, 0.45);
        linea(xl, yb + 2, x + w - 16, yb + 2);
        if (r.texto) enRenglones(r.texto, [{ x1: xl + 3, x2: x + w - 16, l: yb + 2 }], 8.6, 6.4);
      });
    };
    var iconoCrece = function(cx, cy, c){
      trazo(c, 2.2);
      pdf.circle(X(cx), X(cy), X(37), 'S');
      flechaEnCirculo(cx, cy, 37, c);
      relleno(c);
      pdf.rect(X(cx - 18), X(cy + 6), X(8), X(11), 'F');
      pdf.rect(X(cx - 6), X(cy - 2), X(8), X(19), 'F');
      pdf.rect(X(cx + 6), X(cy - 10), X(8), X(27), 'F');
      trazo(c, 1.8);
      pdf.line(X(cx - 20), X(cy - 4), X(cx - 6), X(cy - 14));
      pdf.line(X(cx - 6), X(cy - 14), X(cx + 2), X(cy - 9));
      pdf.line(X(cx + 2), X(cy - 9), X(cx + 15), X(cy - 22));
      pdf.triangle(X(cx + 19), X(cy - 26), X(cx + 9), X(cy - 23), X(cx + 16), X(cy - 16), 'F');
    };
    var iconoReloj = function(cx, cy, c){
      trazo(c, 2.2);
      pdf.circle(X(cx), X(cy), X(37), 'S');
      flechaEnCirculo(cx, cy, 37, c);
      trazo(c, 2.4);
      pdf.line(X(cx), X(cy), X(cx), X(cy - 22));
      pdf.line(X(cx), X(cy), X(cx + 15), X(cy + 11));
      relleno(c);
      pdf.circle(X(cx), X(cy), X(3.2), 'F');
    };
    plan('planAmarillo', DZ_PLAN_AM, 42, 470, C.ambar, 6, 'Si queda en AMARILLO:', 'Plan de seguimiento', 'Fecha de revisión (15 días)', iconoCrece);
    plan('planRojo', DZ_PLAN_RO, 530, 483, C.rojo, 7, 'Si queda en ROJO:', 'Plan de 12 días', 'Fecha de revisión', iconoReloj);

    // ---------- 8. Observaciones finales ----------
    caja(42, 1287, 971, 99);
    pastilla(8, 'Observaciones finales', 42, 1254);
    trazo(C.navy, 0.45);
    [1312, 1339, 1365].forEach(function(y){ linea(58, y, 995, y); });
    enRenglones(f.observaciones, [{ x1: 60, x2: 995, l: 1312 }, { x1: 60, x2: 995, l: 1339 }, { x1: 60, x2: 995, l: 1365 }], 9);

    // ---------- Firmas ----------
    trazo(C.navy, 0.6);
    linea(95, 1413, 402, 1413);
    linea(653, 1413, 962, 1413);
    trazo(C.oro, 0.8);
    linea(PIE, 1396, PIE, 1446);
    fuente('times', 'normal', 11.4, C.navy);
    txt('Firma del asesor', X(248.5), X(1439), 'center');
    txt('Firma del líder', X(807.5), X(1439), 'center');
    fuente('helvetica', 'normal', 7.6, C.gris);
    txt(f.agenteNombre || '', X(248.5), X(1455), 'center');
    txt(f.lider || '', X(807.5), X(1455), 'center');
    trazo(C.oro, 0.8);
    linea(42, 1470, PIE - 16, 1470);
    linea(PIE + 16, 1470, 1013, 1470);
    rombo(PIE, 1470, 7, C.oro);
    return pdf;
  }
</script>
