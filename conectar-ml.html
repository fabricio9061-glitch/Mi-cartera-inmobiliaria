<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectar Mercado Libre | MALAVE</title>
  <link rel="icon" type="image/png" href="iso-malave.png">
  <style>
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:#f5f6f8; color:#243447; }
    .box{ max-width:460px; margin:12vh auto; background:#fff; border-radius:16px; padding:28px 24px; box-shadow:0 10px 40px rgba(10,20,35,.12); text-align:center; }
    h1{ font-size:1.35rem; margin:0 0 10px; }
    p{ color:#5b6573; line-height:1.5; }
    button,a.btn{ display:inline-block; margin-top:14px; background:#16273f; color:#fff; border:none; border-radius:999px; padding:12px 26px; font-size:1rem; cursor:pointer; text-decoration:none; }
    button[disabled]{ opacity:.6; cursor:default; }
    .err{ color:#c0392b; }
  </style>
</head>
<body>
  <!-- Conecta la cuenta de Mercado Libre de la inmobiliaria. Solo el CEO:
       el servidor arma la URL con un "state" de un solo uso (urlConexionML) y
       callbackML rechaza cualquier código que no lo traiga. -->
  <div class="box">
    <h1>Conectar Mercado Libre</h1>
    <p id="msg">Verificando sesión…</p>
    <button id="btn" style="display:none" type="button">Conectar cuenta</button>
    <a id="login" class="btn" href="index.html" style="display:none">Iniciar sesión</a>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
  <script src="malave-config.js?v=20260830b"></script>
  <script>
    firebase.initializeApp(window.firebaseConfig);
    var msg = document.getElementById('msg'), btn = document.getElementById('btn');
    firebase.auth().onAuthStateChanged(function (u) {
      if (!u) {
        msg.textContent = 'Iniciá sesión con la cuenta del CEO y volvé a abrir esta página.';
        document.getElementById('login').style.display = 'inline-block';
        return;
      }
      msg.textContent = 'Vas a entrar a Mercado Libre con la cuenta de la inmobiliaria. El enlace vale 15 minutos.';
      btn.style.display = 'inline-block';
    });
    btn.addEventListener('click', function () {
      btn.disabled = true;
      msg.classList.remove('err');
      msg.textContent = 'Preparando la conexión…';
      firebase.functions().httpsCallable('urlConexionML')({})
        .then(function (r) { location.href = r.data.url; })
        .catch(function (e) {
          btn.disabled = false;
          msg.classList.add('err');
          msg.textContent = (e && e.message) || 'No se pudo iniciar la conexión.';
        });
    });
  </script>
</body>
</html>
