<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | MALAVE</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="iso-malave.png">
  <!-- El perfil del agente vive en index.html#perfil/ID, porque ahí están todas
       las herramientas de las tarjetas. Esta página queda solo para que los
       enlaces perfil.html?id=… que ya se compartieron sigan funcionando. -->
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('id') || '';
      location.replace(id ? 'index.html#perfil/' + encodeURIComponent(id) : 'index.html');
    })();
  </script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:48px 16px;color:#16273f">
  <p>Abriendo el perfil… <a href="index.html" style="color:#8a6d12">Ir al inicio</a></p>
</body>
</html>
